import art.arcane.volmit.packaging.PackagingMode
import org.gradle.api.attributes.Usage
import org.gradle.api.attributes.java.TargetJvmVersion
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.tasks.Copy
import org.gradle.api.tasks.WriteProperties
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.toolchain.JavaLanguageVersion

import java.nio.file.Files

buildscript {
    repositories {
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    dependencies {
        classpath('com.github.VolmitSoftware.VolmLib:packaging:master-SNAPSHOT')
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-rc3'
    id 'de.crazydev22.slimjar' version '2.1.9'
}

apply plugin: 'art.arcane.volmit-packaging'

tasks.named('slimJar').get()

group = 'com.volmit'
version = '2.1.0'

String mainClass = 'com.volmit.shapedportals.ShapedPortals'
String apiVersion = '26.1'
String relocatedLibraryPackage = 'com.volmit.shapedportals.libs'
String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
    .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
    .get()
String languageSourceReference = 'ebde960aa4fd53e56f66f6c34b6659d1e2843410'
List<File> languageSourceFiles = fileTree('src/main/resources/languages') {
    include('*.toml')
}.files.toList().sort { File left, File right -> left.name <=> right.name }
List<String> languageSourceLocales = new ArrayList<>(languageSourceFiles.size())
for (File languageSourceFile : languageSourceFiles) {
    String locale = languageSourceFile.name.substring(0, languageSourceFile.name.length() - '.toml'.length())
    languageSourceLocales.add(locale)
}
def languageSourceManifestTask = tasks.register('generateLanguageSourceManifest', WriteProperties) {
    destinationFile.set(layout.buildDirectory.file('generated/language-source/shapedportals-language-source.properties'))
    property('revision', languageSourceReference)
    property('locales', languageSourceLocales.join(','))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile).configure {
    options.release.set(25)
}

tasks.named('compileTestJava', JavaCompile).configure {
    options.release.set(25)
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
    }
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://jitpack.io')
        content {
            includeGroupByRegex('com\\.github\\.VolmitSoftware.*')
        }
    }
}

configurations {
    runtimeLibraryTest {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom(configurations.slimApi)
    }
    currentPaperCompatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
    currentSpigotCompatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

dependencies {
    compileOnly('org.spigotmc:spigot-api:26.1-R0.1-SNAPSHOT')
    compileOnly(files(providers.gradleProperty('wormholesApiJar')
            .orElse('../WormholesPlugin/build/libs/Wormholes-2.0.7-26.2-api.jar')))
    implementation(volmLibCoordinate) {
        changing = true
        transitive = false
    }
    implementation('de.crazydev22.slimjar.helper:spigot:2.1.9')
    slimApi('com.google.code.gson:gson:2.10.1')
    slimApi('com.moandjiezana.toml:toml4j:0.7.2')
    slimApi('net.kyori:adventure-api:4.26.1')
    slimApi('net.kyori:adventure-text-minimessage:4.26.1')
    slimApi('net.kyori:adventure-text-serializer-legacy:4.26.1')
    slimApi('net.kyori:adventure-text-serializer-plain:4.26.1')
    // VolmLib's ComponentMessenger Spigot path pins JSONOptions by data version; without this the
    // shaded jar carries a dangling reference and the thin step refuses it.
    slimApi('net.kyori:adventure-text-serializer-gson:4.26.1')
    slimApi('net.kyori:adventure-text-serializer-json:4.26.1')

    currentPaperCompatibility('io.papermc.paper:paper-api:26.1.2.build.74-stable')
    currentSpigotCompatibility('org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT')

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testImplementation('org.assertj:assertj-core:3.27.4')
    testImplementation('org.mockito:mockito-core:5.23.0')
    testImplementation('io.papermc.paper:paper-api:26.1.2.build.74-stable')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.register('compileCurrentPaperCompatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.currentPaperCompatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('spigot-api-')
    })
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/currentPaperCompatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.register('compileCurrentSpigotCompatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.currentSpigotCompatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('spigot-api-')
    })
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/currentSpigotCompatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('processResources').configure {
    dependsOn(languageSourceManifestTask)
    exclude('languages/*.toml')
    from(languageSourceManifestTask)
    Map<String, String> pluginProperties = [
        name      : rootProject.name,
        version   : project.version.toString(),
        main      : mainClass,
        apiVersion: apiVersion
    ]
    inputs.properties(pluginProperties)
    filesMatching('plugin.yml') {
        expand(pluginProperties)
    }
}

tasks.named('sourcesJar').configure {
    exclude('languages/**')
}

tasks.named('jar').configure {
    archiveClassifier.set('thin')
}

slimJar {
    relocate('com.google.gson', "${relocatedLibraryPackage}.gson")
    relocate('com.moandjiezana.toml', "${relocatedLibraryPackage}.toml")
    relocate('net.kyori', "${relocatedLibraryPackage}.kyori")
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    minimize {
        exclude(dependency('de.crazydev22.slimjar.helper:.*:.*'))
    }
    relocate('io.github.slimjar', "${relocatedLibraryPackage}.slimjar")
    relocate('art.arcane.volmlib', "${relocatedLibraryPackage}.volmlib")
    relocate('com.google.gson', "${relocatedLibraryPackage}.gson")
    relocate('com.moandjiezana.toml', "${relocatedLibraryPackage}.toml")
    relocate('net.kyori', "${relocatedLibraryPackage}.kyori") {
        skipStringConstants = true
    }
}

def runtimeLibraryTestJar = tasks.register('runtimeLibraryTestJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName.set('runtime-libraries.jar')
    destinationDirectory.set(layout.buildDirectory.dir('test-libraries'))
    configurations = [project.configurations.runtimeLibraryTest]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    relocate('com.google.gson', "${relocatedLibraryPackage}.gson")
    relocate('com.moandjiezana.toml', "${relocatedLibraryPackage}.toml")
    relocate('net.kyori', "${relocatedLibraryPackage}.kyori")
}

tasks.named('test').configure {
    useJUnitPlatform()
    systemProperty('shapedportals.projectDir', layout.projectDirectory.asFile.absolutePath)
    exclude('com/volmit/shapedportals/RuntimeJarTest.class')
}

def packagingTest = tasks.register('packagingTest', Test) {
    group = 'verification'
    description = 'Runs the tests that load the packaged runtime jars.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include('com/volmit/shapedportals/RuntimeJarTest.class')
    dependsOn(tasks.named('shadowJar'))
    dependsOn(runtimeLibraryTestJar)
    useJUnitPlatform()
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    inputs.file(runtimeLibraryTestJar.flatMap { it.archiveFile })
    doFirst {
        systemProperty('shapedportals.runtimeJar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath)
        systemProperty('shapedportals.runtimeTestLibraries', runtimeLibraryTestJar.get().archiveFile.get().asFile.absolutePath)
    }
}

tasks.register('verifyJava25Artifact') {
    dependsOn(tasks.named('shadowJar'))
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    doLast {
        File artifact = tasks.named('shadowJar').get().archiveFile.get().asFile
        java.util.zip.ZipFile archive = new java.util.zip.ZipFile(artifact)
        int pluginMetadataCount = 0
        int maximumClassMajor = 0
        boolean bStatsMetricsClassPresent = false
        Set<String> bundledLanguages = new TreeSet<>()
        Properties languageManifest = null
        try {
            if (archive.getEntry('slimjar.dat') == null
                    || archive.getEntry('slimjar-resolutions.dat') == null
                    || archive.getEntry('com/volmit/shapedportals/libs/slimjar/app/builder/SpigotApplicationBuilder.class') == null) {
                throw new GradleException('Runtime artifact is missing its dependency bootstrap')
            }
            Enumeration<? extends java.util.zip.ZipEntry> entries = archive.entries()
            while (entries.hasMoreElements()) {
                java.util.zip.ZipEntry entry = entries.nextElement()
                String path = entry.name
                if (path.startsWith('com/volmit/shapedportals/libs/gson/')
                        || path.startsWith('com/volmit/shapedportals/libs/toml/')
                        || path.startsWith('com/volmit/shapedportals/libs/kyori/')) {
                    throw new GradleException("Runtime-downloaded library is bundled in shaded artifact: ${path}")
                }
                if (path == 'plugin.yml') {
                    pluginMetadataCount++
                }
                if (!entry.directory && path.startsWith('languages/') && path.endsWith('.toml')) {
                    bundledLanguages.add(path.substring('languages/'.length(), path.length() - '.toml'.length()))
                }
                if (!entry.directory && path == 'shapedportals-language-source.properties') {
                    languageManifest = new Properties()
                    archive.getInputStream(entry).withCloseable { InputStream input -> languageManifest.load(input) }
                }
                if (path.startsWith('art/arcane/volmlib/')) {
                    throw new GradleException("Unrelocated VolmLib class in shaded artifact: ${path}")
                }
                if (path.startsWith('org/bstats/')) {
                    throw new GradleException("Unpackaged bStats class in shaded artifact: ${path}")
                }
                if (path == 'com/volmit/shapedportals/metrics/Metrics.class') {
                    bStatsMetricsClassPresent = true
                }
                if (!entry.directory && path.endsWith('.class')) {
                    DataInputStream input = new DataInputStream(archive.getInputStream(entry))
                    try {
                        int magic = input.readInt()
                        input.readUnsignedShort()
                        int major = input.readUnsignedShort()
                        if (Integer.toUnsignedLong(magic) != 0xCAFEBABEL) {
                            throw new GradleException("Invalid class header in shaded artifact: ${path}")
                        }
                        maximumClassMajor = Math.max(maximumClassMajor, major)
                    } finally {
                        input.close()
                    }
                }
            }
        } finally {
            archive.close()
        }
        if (pluginMetadataCount != 1) {
            throw new GradleException("Expected one plugin.yml, found ${pluginMetadataCount}")
        }
        if (maximumClassMajor > 69) {
            throw new GradleException("Shaded artifact contains class major ${maximumClassMajor}; Java 25 allows at most 69")
        }
        if (!bStatsMetricsClassPresent) {
            throw new GradleException('Shaded artifact does not contain the package-isolated bStats Metrics class')
        }
        if (!bundledLanguages.isEmpty()) {
            throw new GradleException("Runtime artifact contains language resources: ${bundledLanguages}")
        }
        if (languageManifest == null) {
            throw new GradleException('Runtime artifact is missing shapedportals-language-source.properties')
        }
        if (languageManifest.getProperty('revision') != languageSourceReference
                || languageManifest.getProperty('locales') != languageSourceLocales.join(',')) {
            throw new GradleException('Runtime language source manifest does not match the build source set')
        }
        if (languageManifest.stringPropertyNames().any { String key -> key.startsWith('sha256.') }) {
            throw new GradleException('Runtime language source manifest must match the pinned repository revision')
        }
    }
}

tasks.named('check').configure {
    dependsOn(packagingTest)
    dependsOn(tasks.named('compileCurrentPaperCompatibility'))
    dependsOn(tasks.named('compileCurrentSpigotCompatibility'))
    dependsOn(tasks.named('verifyJava25Artifact'))
}

def reactApiPackTask = tasks.register('copyReactApiPack', Copy) {
    from('src/main/resources/react-api-packs/shapedportals-runtime.toml')
    into(layout.buildDirectory.dir('distributions/react-api-packs'))
}

tasks.named('build').configure {
    dependsOn(tasks.named('shadowJar'))
    dependsOn(reactApiPackTask)
}

publishing {
    publications {
        shapedPortals(MavenPublication) {
            groupId = project.group.toString()
            artifactId = 'shapedportals'
            version = project.version.toString()
            artifact(tasks.named('shadowJar'))
            artifact(tasks.named('sourcesJar'))
            pom {
                name = 'ShapedPortals'
                description = 'Arbitrary-shape Nether and End portals for Spigot, Paper, and Folia.'
                url = 'https://github.com/VolmitSoftware/ShapedPortals'
            }
        }
    }
}

tasks.named('publishToMavenLocal').configure {
    dependsOn(tasks.named('check'))
    dependsOn(reactApiPackTask)
}

tasks.register('buildPsychoLT', Copy) {
    group = 'development'
    description = 'Builds, verifies, and deploys ShapedPortals to the managed Minecraft test-server dropins.'
    outputs.upToDateWhen { false }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(tasks.named('check'), 'packedJar', reactApiPackTask)
    from({ tasks.named('packedJar').get().outputJar })
    into(layout.projectDirectory.dir('../../[Minecraft Server]/consumers/plugin-consumers/dropins/plugins'))
    rename { String ignored -> 'ShapedPortals.jar' }
    doLast {
        project.copy {
            from(tasks.named('packedJar').get().outputJar.get().asFile)
            into(layout.projectDirectory.dir('../PluginOuts'))
            rename { String fileName -> fileName.replaceFirst(/-packed\.jar$/, '.jar') }
        }
    }
}

tasks.register('buildSwiftSwamp', Copy) {
    group = 'development'
    description = 'Builds, verifies, and stages ShapedPortals in the workspace BUILDS directory.'
    outputs.upToDateWhen { false }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(tasks.named('check'), 'packedJar')
    from({ tasks.named('packedJar').get().outputJar })
    into(file('../BUILDS'))
    rename { String ignored -> 'ShapedPortals.jar' }
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
    resolutionStrategy.cacheDynamicVersionsFor(0, 'seconds')
}

pluginPackaging {
    artifacts {
        create('distribution') {
            stripDirectories = true
            stripLocalVariables = true
            releaseCompression = providers.gradleProperty('compactRelease').map { it.toBoolean() }
                    .getOrElse(!PackagingMode.resolve(providers).development())
            packed = true
            taskName = 'shadowJar'
            policyName = 'ShapedPortals'
            prunePrefixes = ['com/volmit/shapedportals/libs/volmlib/']
            keepPrefixes = ['com/volmit/shapedportals/libs/volmlib/util/matter/slices/']
            shrinkRules = [file('packaging/shrink.pro')]
            shrinkRelocations = [
                'com.google.gson': "${relocatedLibraryPackage}.gson",
                'com.moandjiezana.toml': "${relocatedLibraryPackage}.toml",
                'net.kyori': "${relocatedLibraryPackage}.kyori"
            ]
        }
    }
}

configurations {
    paper263Compatibility {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                    objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_API))
            attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

dependencies {
    paper263Compatibility('io.papermc.paper:paper-api:26.3.build.25-alpha')
}

tasks.register('compilePaper263Compatibility', JavaCompile) {
    source = sourceSets.main.java
    classpath = configurations.paper263Compatibility + files(sourceSets.main.compileClasspath.filter { File dependency ->
        !dependency.name.startsWith('paper-api-') && !dependency.name.startsWith('spigot-api-')
    })
    destinationDirectory.set(layout.buildDirectory.dir('classes/java/paper263Compatibility'))
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('check').configure {
    dependsOn(tasks.named('compilePaper263Compatibility'))
}
