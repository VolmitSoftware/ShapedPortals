# ShapedPortals-Sprache: de_DE
# Diese Datei wird nur heruntergeladen, wenn sie fehlt; bearbeite languages/de_DE.toml direkt.
# Lokale Änderungen werden nie automatisch ersetzt; fehlende Einträge verwenden Englisch.
# Farben: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB]. MiniMessage bleibt für eigene Formatierungen verfügbar.
# Platzhalter gehören jeweils zu einer bestimmten Nachricht. Nur vorhandene Platzhalter behalten und niemals umbenennen.
# Befehle: {argument}=unerwartetes Argument; {command}=Befehlspfad; {key}=Parameterschlüssel; {parameter}=Parametername; {type}=Parametertyp; {usage}=Befehlsverwendung.
# Laufzeit: {attempts}=Erstellungsversuche; {created}=Erfolgsanzahl oder Erstellungszeit; {rejected}=abgelehnte Versuche; {enabled}=Erstellungsstatus; {hot_reload}=Hot-Reload-Status; {scheduler}=Scheduler-Implementierung.
# Portale: {portal}=Portalbezeichner; {portals}=verwaltete Anzahl; {id}=Kurz-ID; {uuid}=vollständige UUID; {world}=Welt; {axis}=Portalachse; {x}/{y}/{z}=Ankerkoordinaten; {blocks}=Portalzellen; {cells}=alle verwalteten Zellen; {creator}=Ersteller; {materials}=aufgezeichnete Rahmenmaterialien.
# Listen: {matches}=passende Portale; {seconds}=Bestätigungszeit in Sekunden.
# Konfiguration: {category}=Editorkategorie; {setting}=Einstellungsname; {status}=Auswahlmarkierung; {value}=aktueller, Standard- oder Rohwert; {language}=aktive Sprache; {locale}=Sprachkennung; {name}=vollständiger Sprachname.
# Sprach-Editor: {variables}=gültige Platzhalter; {old}=vorheriger Wert; {new}=neuer Wert.
# Sonstiges: {duration}=Millisekunden; {path}=lokaler Berichtspfad; {url}=öffentliche Berichts-URL; {reason}=Fehlergrund.
# Präfix: {prefix}=der globale Wert runtime.prefix. Entferne {prefix} aus einer einzelnen Nachricht, um es dort auszublenden.
# Ein vorangestellter Rückwärtsschrägstrich zeigt & oder [ wörtlich an.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cDieser Befehl kann nur von einem Spieler verwendet werden.&r"

[runtime.permission]
denied = "{prefix}&cDu hast keine Berechtigung dafür.&r"

[runtime.hot_reload]
success = "{prefix}&aÄnderungen an Konfiguration und Sprachdatei wurden übernommen.&r"
failed = "{prefix}&cDateiänderungen wurden abgelehnt; die letzten gültigen Einstellungen bleiben aktiv.&r"

[command.feedback.reload]
success = "{prefix}&aIn &f{duration}&r&a ms neu geladen.&r &7Sprache:&r &f{locale}&r"
failed = "{prefix}&cNeuladen nach {duration} ms fehlgeschlagen.&r &7Die letzten gültigen Einstellungen bleiben aktiv; der vollständige Fehler steht in der Konsole.&r"

[command.feedback.config]
opened = "{prefix}&aDer vollständige Konfigurationseditor wurde geöffnet.&r"
saved = "{prefix}&a&f{setting}&r&a wurde gespeichert und übernommen.&r"
save_failed = "{prefix}&c&f{setting}&r&c konnte nicht übernommen werden: {reason}&r"

[command.feedback]
failed = "{prefix}&cDer Befehl konnte nicht ausgeführt werden. Details stehen in der Konsole.&r"

[command.feedback.debug]
started = "{prefix}&7Server- und ShapedPortals-Diagnosedaten werden erfasst…&r"
busy = "{prefix}&eEin ShapedPortals-Diagnosebericht wird bereits erstellt.&r"
saved = "{prefix}&aDer Diagnosebericht wurde unter &f{path}&r&a gespeichert.&r"
uploaded = "{prefix}&aDiagnosebericht hochgeladen:&r &b&n{url}&r"
link_hover = "&7Öffnet den öffentlichen Bericht auf mclo.gs.&r"
upload_failed = "{prefix}&eDer lokale Bericht wurde gespeichert, aber das Hochladen zu mclo.gs ist fehlgeschlagen. Details stehen in der Konsole.&r"
failed = "{prefix}&cDer Diagnosebericht konnte nicht erstellt werden. Details stehen in der Konsole.&r"

[command.status]
header = "{prefix}&d&lShapedPortals-Laufzeit&r"
config = "{prefix}&7Erstellung:&r {enabled} &8|&r &7Sprache:&r &f{language}&r &8|&r &7Automatisches Neuladen:&r {hot_reload}"
portals = "{prefix}&7Verwaltete Portale:&r &f{portals}&r &8|&r &7Innenzellen:&r &f{cells}&r"
attempts = "{prefix}&7Versuche:&r &f{attempts}&r &8|&r &7Erstellt:&r &a{created}&r &8|&r &7Abgelehnt:&r &c{rejected}&r"
compatibility = "{prefix}&7Artefakt:&r &fJava 17 / Bukkit 1.20.1+&r &8|&r &7Planer:&r &f{scheduler}&r"

