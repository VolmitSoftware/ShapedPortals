# ShapedPortals — de_DE
#
# === Datei bearbeiten ===
# plugins/ShapedPortals/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /shapedportals language server edit de_DE
#
# === Präfix ===
# {prefix}  der globale Wert runtime.prefix. Entferne {prefix} aus einer einzelnen Nachricht, um es dort auszublenden
#
# === Formatierung ===
# Farben: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB]. MiniMessage bleibt für eigene Formatierungen verfügbar.
# Ein vorangestellter Rückwärtsschrägstrich zeigt & oder [ wörtlich an.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {after}  Wert nach der Änderung
#   {argument}  unerwartetes Argument
#   {attempts}  Erstellungsversuche
#   {axis}  Portalachse
#   {before}  Wert vor der Änderung
#   {blocks}  Portalzellen
#   {category}  Editorkategorie
#   {cells}  alle verwalteten Zellen
#   {command}  Befehlspfad
#   {count}  Anzahl übereinstimmender Einträge
#   {created}  Erfolgsanzahl oder Erstellungszeit
#   {creator}  Ersteller
#   {enabled}  Erstellungsstatus
#   {group}  Erlaubnis oder Spielergruppe
#   {hot_reload}  Hot-Reload-Status
#   {id}  Kurz-ID
#   {key}  Parameterschlüssel
#   {language}  aktive Sprache
#   {line}  Quellleitung oder Zeilennummer
#   {locale}  Sprachkennung
#   {matches}  passende Portale
#   {materials}  aufgezeichnete Rahmenmaterialien
#   {maximum}  Zulässiger Höchstwert
#   {name}  vollständiger Sprachname
#   {new}  neuer Wert
#   {old}  vorheriger Wert
#   {parameter}  Parametername
#   {path}  lokaler Berichtspfad
#   {permission}  erforderliche Berechtigung
#   {personal}  persönliche Sprachkennung
#   {plugin}  Plugin Name
#   {portal}  Portalbezeichner
#   {portals}  verwaltete Anzahl
#   {prefix}  der globale Wert runtime.prefix. Entferne {prefix} aus einer einzelnen Nachricht, um es dort auszublenden
#   {reason}  Fehlergrund
#   {rejected}  abgelehnte Versuche
#   {scheduler}  Scheduler-Implementierung
#   {seconds}  Bestätigungszeit in Sekunden
#   {setting}  Einstellungsname
#   {status}  Auswahlmarkierung
#   {target}  Zielspieler, Entität oder Wert
#   {type}  Parametertyp
#   {url}  öffentliche Berichts-URL
#   {usage}  Befehlsverwendung
#   {uuid}  vollständige UUID
#   {value}  aktueller, Standard- oder Rohwert
#   {variables}  gültige Platzhalter
#   {version}  Plugin-Version
#   {world}  Welt
#   {x}  Ankerkoordinaten
#   {y}  Ankerkoordinaten
#   {z}  Ankerkoordinaten

