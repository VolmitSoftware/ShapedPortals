# ShapedPortals — de_DE
#
# === Datei bearbeiten ===
# plugins/ShapedPortals/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; für fehlende oder ungültige Einträge wird das eingebaute Englisch verwendet.
# /shapedportals language server edit de_DE
#
# === Präfix ===
# {prefix}  Formatierter Pluginname aus runtime.prefix; das Trennzeichen steht in der Nachricht. Entferne {prefix}&r &7› &7, um Namen und Trennzeichen auszublenden.
#
# === Formatierung ===
# Farben: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB]. MiniMessage bleibt für eigene Formatierungen verfügbar.
# Ein vorangestellter Backslash zeigt & oder [ wörtlich an.
#
# === Variablen ===
# Lass die Variablennamen unverändert und verwende nur die Variablen der jeweiligen Nachricht.
#   {added}  Durch eine Sprachaktualisierung hinzugefügte Nachrichten
#   {after}  Wert nach der Änderung
#   {argument}  Unerwartetes Befehlsargument
#   {attempts}  Versuche, ein Portal zu erstellen
#   {axis}  Portalachse
#   {before}  Wert vor der Änderung
#   {blocks}  Innenzellen des Portals
#   {category}  Editorkategorie
#   {cells}  Alle verwalteten Zellen
#   {command}  Befehlspfad
#   {count}  Anzahl der Nachrichten
#   {created}  Anzahl erstellter Portale oder Erstellungszeit
#   {creator}  Ersteller
#   {enabled}  Status der Portalerstellung
#   {group}  Name der Nachrichtenkategorie
#   {hot_reload}  Status des automatischen Neuladens
#   {id}  Kurze Portal-ID
#   {kept}  Bei einer Sprachaktualisierung behaltene lokale Änderungen
#   {key}  Parameterschlüssel
#   {language}  Aktive Sprache
#   {line}  Zeilennummer der Nachricht
#   {locale}  Sprachkennung
#   {matches}  Anzahl passender Portale
#   {materials}  Erfasste Rahmenmaterialien
#   {maximum}  Höchster zulässiger Wert
#   {name}  Vollständiger Sprachname
#   {new}  Neuer Wert
#   {old}  Vorheriger Wert
#   {parameter}  Parametername
#   {path}  Lokaler Berichtspfad
#   {permission}  Erforderliche Berechtigung
#   {personal}  Persönliche Sprachkennung, falls sie vom Serverstandard abweicht
#   {portal}  Portalkennung
#   {portals}  Anzahl verwalteter Portale
#   {prefix}  Wert von runtime.prefix; pro Nachricht optional
#   {reason}  Fehlergrund
#   {rejected}  Abgelehnte Erstellungsversuche
#   {remaining}  Verbleibende Wartezeit bis zur nächsten Sprachprüfung
#   {scheduler}  Scheduler-Implementierung
#   {seconds}  Bestätigungszeitraum in Sekunden
#   {section}  Abschnitt des Spracheditors
#   {setting}  Name der Einstellung
#   {status}  Auswahlmarkierung
#   {target}  Ziel der Sprachauswahl
#   {type}  Parametertyp oder Portaltyp
#   {updated}  Durch eine Sprachaktualisierung geänderte Nachrichten
#   {url}  Öffentliche Berichts-URL
#   {uuid}  Vollständige Portal-UUID
#   {value}  Aktueller, Standard- oder Rohwert
#   {variables}  Gültige Platzhalter der gewählten Nachricht
#   {version}  Plugin-Version
#   {world}  Weltname
#   {x}  Ankerkoordinaten
#   {y}  Ankerkoordinaten
#   {z}  Ankerkoordinaten

