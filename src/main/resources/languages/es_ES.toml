# ShapedPortals — es_ES
#
# === Editar el archivo ===
# plugins/ShapedPortals/languages/es_ES.toml
# Puede editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /shapedportals language server edit es_ES
#
# === Prefijo ===
# {prefix}  Nombre del plugin con formato de runtime.prefix; el separador está en el mensaje. Elimina {prefix}&r &7› &7 para ocultar ambos.
#
# === Formato ===
# Colores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB]. MiniMessage sigue disponible para formatos personalizados.
# Antepón una barra inversa para mostrar & o [ literalmente.
#
# === Variables ===
# Mantenga los nombres de las variables y use solo las que ya contiene cada mensaje.
#   {after}  Valor después del cambio
#   {argument}  argumento inesperado
#   {attempts}  intentos de creación
#   {axis}  eje
#   {before}  Valor antes del cambio
#   {blocks}  celdas del portal
#   {category}  categoría
#   {cells}  todas las celdas
#   {command}  ruta del comando
#   {count}  Número de entradas coincidentes
#   {created}  cantidad creada o fecha de creación
#   {creator}  creador
#   {enabled}  estado de creación
#   {group}  Grupo de permisos o jugadores
#   {hot_reload}  estado de recarga
#   {id}  ID corto
#   {key}  clave del parámetro
#   {language}  idioma activo
#   {line}  Línea de origen o número de línea
#   {locale}  configuración regional
#   {matches}  portales coincidentes
#   {materials}  materiales de marco registrados
#   {maximum}  Valor máximo permitido
#   {name}  nombre completo del idioma
#   {new}  valor nuevo
#   {old}  valor anterior
#   {parameter}  nombre del parámetro
#   {path}  ruta local del informe
#   {permission}  permiso necesario
#   {personal}  configuración regional personal
#   {portal}  identificador
#   {portals}  cantidad gestionada
#   {prefix}  Nombre del plugin con formato de runtime.prefix; el separador está en el mensaje. Elimina {prefix}&r &7› &7 para ocultar ambos.
#   {reason}  motivo del fallo
#   {rejected}  intentos rechazados
#   {scheduler}  planificador
#   {seconds}  plazo de confirmación en segundos
#   {section}  Sección del editor
#   {setting}  ajuste
#   {status}  marca de selección
#   {target}  Objetivo jugador, entidad o valor
#   {type}  tipo
#   {url}  URL pública
#   {uuid}  UUID completo
#   {value}  valor actual, predeterminado o sin procesar
#   {variables}  marcadores válidos
#   {version}  versión del plugin
#   {world}  mundo
#   {x}  coordenadas del ancla
#   {y}  coordenadas del ancla
#   {z}  coordenadas del ancla

