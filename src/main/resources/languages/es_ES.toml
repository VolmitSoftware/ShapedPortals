# Idioma de ShapedPortals: es_ES
# Este archivo se descarga solo si no existe; edita languages/es_ES.toml directamente.
# Los cambios locales nunca se reemplazan automáticamente; las entradas ausentes usan inglés.
# Colores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB]. MiniMessage sigue disponible para formatos personalizados.
# Cada marcador pertenece a mensajes concretos. Conserva solo los marcadores ya presentes y no cambies sus nombres.
# Comandos: {argument}=argumento inesperado; {command}=ruta del comando; {key}=clave del parámetro; {parameter}=nombre del parámetro; {type}=tipo; {usage}=uso del comando.
# Ejecución: {attempts}=intentos de creación; {created}=cantidad creada o fecha de creación; {rejected}=intentos rechazados; {enabled}=estado de creación; {hot_reload}=estado de recarga; {scheduler}=planificador.
# Portales: {portal}=identificador; {portals}=cantidad gestionada; {id}=ID corto; {uuid}=UUID completo; {world}=mundo; {axis}=eje; {x}/{y}/{z}=coordenadas del ancla; {blocks}=celdas del portal; {cells}=todas las celdas; {creator}=creador; {materials}=materiales de marco registrados.
# Listas: {matches}=portales coincidentes; {seconds}=plazo de confirmación en segundos.
# Configuración: {category}=categoría; {setting}=ajuste; {status}=marca de selección; {value}=valor actual, predeterminado o sin procesar; {language}=idioma activo; {locale}=configuración regional; {name}=nombre completo del idioma.
# Editor de idioma: {variables}=marcadores válidos; {old}=valor anterior; {new}=valor nuevo.
# Otros: {duration}=milisegundos; {path}=ruta local del informe; {url}=URL pública; {reason}=motivo del fallo.
# Prefijo: {prefix}=el valor global runtime.prefix. Elimina {prefix} de un mensaje para ocultarlo solo allí.
# Antepón una barra inversa para mostrar & o [ literalmente.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cEste comando solo puede usarlo un jugador.&r"

[runtime.permission]
