# ShapedPortals-kieli: fi_FI
# Tämä tiedosto ladataan vain, jos se puuttuu; muokkaa tiedostoa languages/fi_FI.toml suoraan.
# Paikallisia muutoksia ei korvata automaattisesti; puuttuvat kohdat käyttävät englantia.
# Värit: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. MiniMessage toimii myös omissa muotoiluissa.
# Paikkamerkit ovat viestikohtaisia. Säilytä vain viestissä jo olevat paikkamerkit täsmälleen ennallaan.
# Komennot: {argument}=odottamaton argumentti; {command}=komentopolku; {key}=parametriavain; {parameter}=parametrin nimi; {type}=tyyppi; {usage}=komennon käyttö.
# Suoritus: {attempts}=luontiyritykset; {created}=luotujen määrä tai luontiaika; {rejected}=hylätyt yritykset; {enabled}=luonnin tila; {hot_reload}=pikalatauksen tila; {scheduler}=ajastin.
# Portaalit: {portal}=tunniste; {portals}=hallittujen määrä; {id}=lyhyt ID; {uuid}=täysi UUID; {world}=maailma; {axis}=akseli; {x}/{y}/{z}=ankkurin koordinaatit; {blocks}=portaalisolut; {cells}=kaikki solut; {creator}=luoja; {materials}=tallennetut kehysmateriaalit.
# Luettelot: {matches}=vastaavat portaalit; {seconds}=vahvistusaika sekunteina.
# Asetukset: {category}=luokka; {setting}=asetuksen nimi; {status}=valintamerkki; {value}=nykyinen, oletus- tai raaka-arvo; {language}=aktiivinen kieli; {locale}=kielitunnus; {name}=kielen koko nimi.
# Kielieditori: {variables}=sallitut paikkamerkit; {old}=edellinen arvo; {new}=uusi arvo.
# Muut: {duration}=millisekunnit; {path}=paikallisen raportin polku; {url}=julkinen URL; {reason}=virheen syy.
# Etuliite: {prefix}=yleinen runtime.prefix-arvo. Poista {prefix} yksittäisestä viestistä piilottaaksesi sen siinä.
# Näytä & tai [ kirjaimellisesti lisäämällä eteen kenoviiva.

