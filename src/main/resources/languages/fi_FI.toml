# ShapedPortals — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/ShapedPortals/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvien tai virheellisten arvojen tilalla käytetään sisäänrakennettua englanninkielistä tekstiä.
# /shapedportals language server edit fi_FI
#
# === Etuliite ===
# {prefix}  runtime.prefix määrittää lisäosan muotoillun nimen. Keskusteluviestien mallit lisäävät harmaan › -erottimen.
# Poista viestin alusta {prefix}&r &7› &7, jos haluat piilottaa nimen ja erottimen.
#
# === Muotoilu ===
# Värit ja tyylit: &0-&f, &k-&r. RGB-värit: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. Myös MiniMessage-muotoilua voi käyttää.
# Jos haluat näyttää merkin & tai [ sellaisenaan, lisää sen eteen kenoviiva.
#
# === Muuttujat ===
# Älä muuta muuttujien nimiä, ja käytä kussakin viestissä vain sen omia muuttujia.
#   {added}  Kielipäivityksen lisäämät viestit
#   {after}  Arvo muutoksen jälkeen
#   {argument}  Odottamaton komennon argumentti
#   {attempts}  Portaalien luontiyritykset
#   {axis}  Portaalin akseli
#   {before}  Arvo ennen muutosta
#   {blocks}  Portaalin sisäsolut
#   {category}  Muokkaimen luokka
#   {cells}  Kaikki hallinnoidut solut
#   {command}  Komentopolku
#   {count}  Viestien määrä
#   {created}  Luotujen määrä tai luontiaika
#   {creator}  Luojan tunniste
#   {enabled}  Portaalien luonnin tila
#   {group}  Viestiluokan nimi
#   {hot_reload}  Automaattisen latauksen tila
#   {id}  Portaalin lyhyt tunnus
#   {kept}  Kielipäivityksessä säilytetyt paikalliset muokkaukset
#   {key}  Parametrin avain
#   {language}  Aktiivinen kieli
#   {line}  Viestin rivinumero
#   {locale}  Kielitunnus
#   {matches}  Vastaavien portaalien määrä
#   {materials}  Tallennetut kehysmateriaalit
#   {maximum}  Suurin sallittu arvo
#   {name}  Kielen koko nimi
#   {new}  Uusi arvo
#   {old}  Edellinen arvo
#   {parameter}  Parametrin nimi
#   {path}  Paikallisen raportin polku
#   {permission}  Vaadittu käyttöoikeus
#   {personal}  Henkilökohtainen kielitunnus, jos se poikkeaa palvelimen oletuksesta
#   {portal}  Portaalin tunniste
#   {portals}  Hallinnoitujen portaalien määrä
#   {prefix}  Yleinen runtime.prefix-arvo; valinnainen kussakin viestissä
#   {reason}  Virheen syy
#   {rejected}  Hylätyt luontiyritykset
#   {remaining}  Aika seuraavaan sallittuun kielitarkistukseen
#   {scheduler}  Ajastimen toteutus
#   {seconds}  Vahvistusaika
#   {section}  Kielimuokkaimen osio
#   {setting}  Asetuksen nimi
#   {status}  Valintamerkki
#   {target}  Kielivalinnan kohde
#   {type}  Parametrin tai portaalin tyyppi
#   {updated}  Kielipäivityksen muuttamat viestit
#   {url}  Raportin julkinen URL
#   {uuid}  Portaalin täysi UUID
#   {value}  Nykyinen, oletus- tai raaka-arvo
#   {variables}  Valitussa viestissä sallitut paikkamerkit
#   {version}  Lisäosan versio
#   {world}  Maailman nimi
#   {x}  Ankkurin koordinaatit
#   {y}  Ankkurin koordinaatit
#   {z}  Ankkurin koordinaatit

