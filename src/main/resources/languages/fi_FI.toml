# ShapedPortals — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/ShapedPortals/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /shapedportals language server edit fi_FI
#
# === Etuliite ===
# {prefix}  Muotoiltu lisäosan nimi arvosta runtime.prefix; erotin on viestissä. Poista {prefix}&r &7› &7 piilottaaksesi nimen ja erottimen.
#
# === Muotoilu ===
# Värit: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. MiniMessage toimii myös omissa muotoiluissa.
# Näytä & tai [ kirjaimellisesti lisäämällä eteen kenoviiva.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {after}  Arvo muutoksen jälkeen
#   {argument}  odottamaton argumentti
#   {attempts}  luontiyritykset
#   {axis}  akseli
#   {before}  Arvo ennen muutosta
#   {blocks}  portaalisolut
#   {category}  luokka
#   {cells}  kaikki solut
#   {command}  komentopolku
#   {count}  Täsmäytysten lukumäärä
#   {created}  luotujen määrä tai luontiaika
#   {creator}  luoja
#   {enabled}  luonnin tila
#   {group}  Lupa tai pelaajaryhmä
#   {hot_reload}  pikalatauksen tila
#   {id}  lyhyt ID
#   {key}  parametriavain
#   {language}  aktiivinen kieli
#   {line}  Lähderivi tai viivanumero
#   {locale}  kielitunnus
#   {matches}  vastaavat portaalit
#   {materials}  tallennetut kehysmateriaalit
#   {maximum}  Suurin sallittu arvo
#   {name}  kielen koko nimi
#   {new}  uusi arvo
#   {old}  edellinen arvo
#   {parameter}  parametrin nimi
#   {path}  paikallisen raportin polku
#   {permission}  vaadittu käyttöoikeus
#   {personal}  henkilökohtainen kielitunnus
#   {portal}  tunniste
#   {portals}  hallittujen määrä
#   {prefix}  Muotoiltu lisäosan nimi arvosta runtime.prefix; erotin on viestissä. Poista {prefix}&r &7› &7 piilottaaksesi nimen ja erottimen.
#   {reason}  virheen syy
#   {rejected}  hylätyt yritykset
#   {scheduler}  ajastin
#   {seconds}  vahvistusaika sekunteina
#   {section}  Muokkaimen osio
#   {setting}  asetuksen nimi
#   {status}  valintamerkki
#   {target}  Kohdepelaaja, yhteisö tai arvo
#   {type}  tyyppi
#   {url}  julkinen URL
#   {uuid}  täysi UUID
#   {value}  nykyinen, oletus- tai raaka-arvo
#   {variables}  sallitut paikkamerkit
#   {version}  lisäosan versio
#   {world}  maailma
#   {x}  ankkurin koordinaatit
#   {y}  ankkurin koordinaatit
#   {z}  ankkurin koordinaatit

