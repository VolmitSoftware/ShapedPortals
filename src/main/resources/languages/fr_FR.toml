# Langue de ShapedPortals : fr_FR
#
# Ce fichier est téléchargé uniquement s’il manque ; modifiez directement languages/fr_FR.toml.
# Les modifications locales ne sont jamais remplacées automatiquement ; les entrées absentes utilisent l’anglais.
#
# Couleurs : &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B et [RRGGBB]. MiniMessage reste disponible pour les formats personnalisés.
# Les variables sont propres à chaque message. Conservez uniquement celles déjà présentes, sans jamais les renommer.
#
# Commandes
#   {argument}      argument inattendu
#   {command}       chemin de commande
#   {key}           clé du paramètre
#   {parameter}     nom du paramètre
#   {type}          type
#   {usage}         syntaxe de commande
#
# Exécution
#   {attempts}      tentatives de création
#   {created}       nombre créé ou date de création
#   {rejected}      tentatives refusées
#   {enabled}       état de création
#   {hot_reload}    état du rechargement
#   {scheduler}     planificateur
#
# Portails
#   {portal}        identifiant
#   {portals}       nombre géré
#   {id}            ID court
#   {uuid}          UUID complet
#   {world}         monde
#   {axis}          axe
#   {x}/{y}/{z}     coordonnées de l’ancre
#   {blocks}        cellules du portail
#   {cells}         toutes les cellules
#   {creator}       créateur
#   {materials}     matériaux de cadre enregistrés
#
# Listes
#   {matches}       portails correspondants
#   {seconds}       délai de confirmation en secondes
#
# Configuration
#   {category}      catégorie
#   {setting}       nom du réglage
#   {status}        marque de sélection
#   {value}         valeur actuelle, par défaut ou brute
#   {language}      langue active
#   {locale}        code régional
#   {personal}      code régional personnel
#   {name}          nom complet de la langue
#
# Éditeur de langue
#   {variables}     variables valides
#   {old}           ancienne valeur
#   {new}           nouvelle valeur
#
# Autres
#   {path}          chemin du rapport local
#   {url}           URL publique
#   {reason}        motif de l’échec
#
# Préfixe
#   {prefix}        la valeur globale runtime.prefix. Retirez {prefix} d’un message pour le masquer uniquement à cet endroit
#
# Ajoutez une barre oblique inverse devant & ou [ pour l’afficher littéralement.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cCette commande ne peut être utilisée que par un joueur.&r"

[runtime.permission]
