# שפת ShapedPortals: he_IL
# הקובץ יורד רק אם הוא חסר; יש לערוך ישירות את languages/he_IL.toml.
# שינויים מקומיים לעולם אינם מוחלפים אוטומטית; ערכים חסרים משתמשים באנגלית.
# צבעים: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. ניתן להשתמש גם ב-MiniMessage לעיצוב מותאם.
# מצייני המקום שייכים להודעות מסוימות. יש להשאיר רק את המציינים שכבר מופיעים בהודעה ולא לשנות את שמם.
# פקודות: {argument}=ארגומנט לא צפוי; {command}=נתיב פקודה; {key}=מפתח פרמטר; {parameter}=שם פרמטר; {type}=סוג; {usage}=אופן שימוש.
# זמן ריצה: {attempts}=ניסיונות יצירה; {created}=כמות שנוצרה או זמן יצירה; {rejected}=ניסיונות שנדחו; {enabled}=מצב יצירה; {hot_reload}=מצב טעינה חמה; {scheduler}=מתזמן.
# פורטלים: {portal}=מזהה; {portals}=כמות מנוהלת; {id}=מזהה קצר; {uuid}=UUID מלא; {world}=עולם; {axis}=ציר; {x}/{y}/{z}=קואורדינטות עוגן; {blocks}=תאי פורטל; {cells}=כל התאים; {creator}=יוצר; {materials}=חומרי המסגרת שנרשמו.
# רשימות: {matches}=פורטלים תואמים; {seconds}=חלון אישור בשניות.
# הגדרות: {category}=קטגוריה; {setting}=שם הגדרה; {status}=סימן בחירה; {value}=ערך נוכחי, ברירת מחדל או גולמי; {language}=שפה פעילה; {locale}=אזור שפה; {name}=שם השפה המלא.
# עורך שפה: {variables}=מצייני מקום תקינים; {old}=הערך הקודם; {new}=הערך החדש.
# אחר: {duration}=אלפיות שנייה; {path}=נתיב דוח מקומי; {url}=כתובת דוח ציבורית; {reason}=סיבת כשל.
# קידומת: {prefix}=הערך הגלובלי runtime.prefix. הסירו את {prefix} מהודעה מסוימת כדי להסתיר אותה רק שם.
# כדי להציג & או [ כלשונם, יש להוסיף לפניהם לוכסן הפוך.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cרק שחקן יכול להשתמש בפקודה זו.&r"

[runtime.permission]
