# ShapedPortals — he_IL
#
# === עריכת הקובץ ===
# plugins/ShapedPortals/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; במקום ערכים חסרים או לא תקינים מוצג הטקסט המובנה באנגלית.
# /shapedportals language server edit he_IL
#
# === קידומת ===
# {prefix}  שם התוסף המעוצב מגיע מ-runtime.prefix. תבניות הצ׳אט מוסיפות את המפריד האפור ›.
# כדי להסתיר את השם ואת המפריד, הסירו את {prefix}&r &7› &7 מתחילת ההודעה.
#
# === עיצוב ===
# צבעים וסגנונות: &0-&f, &k-&r. צבעי RGB: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. אפשר להשתמש גם ב-MiniMessage לעיצוב מותאם.
# כדי להציג & או [ כפי שהם, הוסיפו לפניהם לוכסן הפוך.
#
# === משתנים ===
# אל תשנו את שמות המשתנים, והשתמשו בכל הודעה רק במשתנים השייכים לה.
#   {added}  הודעות שנוספו בעדכון שפה
#   {after}  הערך לאחר השינוי
#   {argument}  ארגומנט פקודה לא צפוי
#   {attempts}  ניסיונות ליצירת פורטל
#   {axis}  ציר הפורטל
#   {before}  הערך לפני השינוי
#   {blocks}  התאים הפנימיים של הפורטל
#   {category}  קטגוריה בעורך
#   {cells}  כל התאים המנוהלים
#   {command}  נתיב הפקודה
#   {count}  מספר ההודעות
#   {created}  מספר הפורטלים שנוצרו או זמן היצירה
#   {creator}  זהות היוצר
#   {enabled}  מצב יצירת הפורטלים
#   {group}  שם קטגוריית ההודעות
#   {hot_reload}  מצב הטעינה החמה
#   {id}  מזהה פורטל מקוצר
#   {kept}  עריכות מקומיות שנשמרו בעדכון שפה
#   {key}  מפתח הפרמטר
#   {language}  השפה הפעילה
#   {line}  מספר השורה בהודעה
#   {locale}  מזהה אזור השפה
#   {matches}  מספר הפורטלים התואמים
#   {materials}  חומרי המסגרת שנרשמו
#   {maximum}  הערך המרבי המותר
#   {name}  שם השפה המלא
#   {new}  הערך החדש
#   {old}  הערך הקודם
#   {parameter}  שם הפרמטר
#   {path}  נתיב הדוח המקומי
#   {permission}  ההרשאה הנדרשת
#   {personal}  אזור השפה האישי, אם הוא שונה מברירת המחדל של השרת
#   {portal}  מזהה הפורטל
#   {portals}  מספר הפורטלים המנוהלים
#   {prefix}  ערך runtime.prefix הכללי; אופציונלי בכל הודעה
#   {reason}  סיבת הכשל
#   {rejected}  ניסיונות יצירה שנדחו
#   {remaining}  הזמן שנותר עד שתותר בדיקת השפות הבאה
#   {scheduler}  מימוש המתזמן
#   {seconds}  חלון האישור
#   {section}  מקטע בעורך השפה
#   {setting}  שם ההגדרה
#   {status}  סימן הבחירה
#   {target}  יעד בחירת השפה
#   {type}  סוג הפרמטר או סוג הפורטל
#   {updated}  הודעות ששונו בעדכון שפה
#   {url}  כתובת הדוח הציבורית
#   {uuid}  ה-UUID המלא של הפורטל
#   {value}  ערך נוכחי, ברירת מחדל או ערך גולמי
#   {variables}  מצייני המקום התקפים בהודעה שנבחרה
#   {version}  גרסת התוסף
#   {world}  שם העולם
#   {x}  קואורדינטות העוגן
#   {y}  קואורדינטות העוגן
#   {z}  קואורדינטות העוגן

