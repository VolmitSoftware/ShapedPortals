[runtime.hot_reload]
success = "{prefix}&aהשינויים בקובצי התצורה והשפה הוחלו.&r"
failed = "{prefix}&cהשינויים בקבצים נדחו; ההגדרות התקינות האחרונות נשארו פעילות.&r"

[command.feedback.reload]
success = "{prefix}&aהטעינה מחדש הושלמה בתוך &f{duration}&r&a אלפיות שנייה.&r &7שפה:&r &f{locale}&r"
failed = "{prefix}&cהטעינה מחדש נכשלה לאחר {duration} אלפיות שנייה.&r &7ההגדרות התקינות האחרונות עדיין פעילות; פרטי השגיאה המלאים מופיעים במסוף.&r"

[command.feedback.config]
opened = "{prefix}&aעורך התצורה המלא בתוך המשחק נפתח.&r"
saved = "{prefix}&aההגדרה &f{setting}&r&a נשמרה והוחלה.&r"
save_failed = "{prefix}&cלא ניתן להחיל את &f{setting}&r&c: {reason}&r"

[command.feedback]
failed = "{prefix}&cלא ניתן להשלים את הפקודה. פרטים נוספים מופיעים במסוף.&r"

[command.feedback.debug]
