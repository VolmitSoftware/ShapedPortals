# ShapedPortals — he_IL
#
# === עריכת הקובץ ===
# plugins/ShapedPortals/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /shapedportals language server edit he_IL
#
# === קידומת ===
# {prefix}  הערך הגלובלי runtime.prefix. הסירו את {prefix} מהודעה מסוימת כדי להסתיר אותה רק שם
#
# === עיצוב ===
# צבעים: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. ניתן להשתמש גם ב-MiniMessage לעיצוב מותאם.
# כדי להציג & או [ כלשונם, יש להוסיף לפניהם לוכסן הפוך.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {after}  ערך לאחר השינוי
#   {argument}  ארגומנט לא צפוי
#   {attempts}  ניסיונות יצירה
#   {axis}  ציר
#   {before}  ערך לפני השינוי
#   {blocks}  תאי פורטל
#   {category}  קטגוריה
#   {cells}  כל התאים
#   {command}  נתיב פקודה
#   {count}  מספר הערכים
#   {created}  כמות שנוצרה או זמן יצירה
#   {creator}  יוצר
#   {enabled}  מצב יצירה
#   {group}  Permission או שחקן
#   {hot_reload}  מצב טעינה חמה
#   {id}  מזהה קצר
#   {key}  מפתח פרמטר
#   {language}  שפה פעילה
#   {line}  מקור או קו מספר
#   {locale}  אזור שפה
#   {matches}  פורטלים תואמים
#   {materials}  חומרי המסגרת שנרשמו
#   {maximum}  ערך מותר מקסימלי
#   {name}  שם השפה המלא
#   {new}  הערך החדש
#   {old}  הערך הקודם
#   {parameter}  שם פרמטר
#   {path}  נתיב דוח מקומי
#   {permission}  ההרשאה הנדרשת
#   {personal}  אזור השפה האישי
#   {plugin}  שם Plugin
#   {portal}  מזהה
#   {portals}  כמות מנוהלת
#   {prefix}  הערך הגלובלי runtime.prefix. הסירו את {prefix} מהודעה מסוימת כדי להסתיר אותה רק שם
#   {reason}  סיבת כשל
#   {rejected}  ניסיונות שנדחו
#   {scheduler}  מתזמן
#   {seconds}  חלון אישור בשניות
#   {setting}  שם הגדרה
#   {status}  סימן בחירה
#   {target}  שחקן היעד, הישות או הערך
#   {type}  סוג
#   {url}  כתובת דוח ציבורית
#   {usage}  אופן שימוש
#   {uuid}  UUID מלא
#   {value}  ערך נוכחי, ברירת מחדל או גולמי
#   {variables}  מצייני מקום תקינים
#   {version}  גרסת התוסף
#   {world}  עולם
#   {x}  קואורדינטות עוגן
#   {y}  קואורדינטות עוגן
#   {z}  קואורדינטות עוגן

