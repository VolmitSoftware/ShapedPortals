# Lingua di ShapedPortals: it_IT
# Questo file viene scaricato solo se manca; modifica direttamente languages/it_IT.toml.
# Le modifiche locali non vengono mai sostituite automaticamente; le voci mancanti usano l’inglese.
# Colori: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. MiniMessage resta disponibile per formati personalizzati.
# I segnaposto appartengono a messaggi specifici. Mantieni solo quelli già presenti e non rinominarli mai.
# Comandi: {argument}=argomento inatteso; {command}=percorso del comando; {key}=chiave parametro; {parameter}=nome parametro; {type}=tipo; {usage}=uso del comando.
# Esecuzione: {attempts}=tentativi di creazione; {created}=numero creato o data di creazione; {rejected}=tentativi rifiutati; {enabled}=stato creazione; {hot_reload}=stato ricaricamento; {scheduler}=scheduler.
# Portali: {portal}=identificatore; {portals}=numero gestito; {id}=ID breve; {uuid}=UUID completo; {world}=mondo; {axis}=asse; {x}/{y}/{z}=coordinate ancora; {blocks}=celle portale; {cells}=tutte le celle; {creator}=creatore; {materials}=materiali della cornice registrati.
# Elenchi: {matches}=portali corrispondenti; {seconds}=tempo di conferma in secondi.
# Configurazione: {category}=categoria; {setting}=nome impostazione; {status}=indicatore selezione; {value}=valore corrente, predefinito o grezzo; {language}=lingua attiva; {locale}=codice locale; {name}=nome completo della lingua.
# Editor lingua: {variables}=segnaposto validi; {old}=valore precedente; {new}=valore nuovo.
# Altro: {duration}=millisecondi; {path}=percorso rapporto locale; {url}=URL pubblico; {reason}=motivo errore.
# Prefisso: {prefix}=il valore globale runtime.prefix. Rimuovi {prefix} da un singolo messaggio per nasconderlo solo lì.
# Anteponi una barra inversa per mostrare & o [ letteralmente.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cQuesto comando può essere usato solo da un giocatore.&r"

[runtime.permission]
denied = "{prefix}&cNon hai il permesso di farlo.&r"

[runtime.hot_reload]
success = "{prefix}&aLe modifiche alla configurazione e ai file di lingua sono state applicate.&r"
failed = "{prefix}&cLe modifiche ai file sono state rifiutate; restano attive le ultime impostazioni valide.&r"

[command.feedback.reload]
success = "{prefix}&aRicaricamento completato in &f{duration}&r&a ms.&r &7Lingua:&r &f{locale}&r"
failed = "{prefix}&cRicaricamento non riuscito dopo {duration} ms.&r &7Restano attive le ultime impostazioni valide; consulta l'errore completo nella console.&r"

[command.feedback.config]
