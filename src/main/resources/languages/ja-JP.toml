# ShapedPortals — ja-JP
#
# === ファイルの編集 ===
# plugins/ShapedPortals/languages/ja-JP.toml
# このファイルは直接編集できます。ローカルの変更は保持され、不足している項目や無効な項目には内蔵の英語が使われます。
# /shapedportals language server edit ja-JP
#
# === 接頭辞 ===
# {prefix}  runtime.prefix の書式付きプラグイン名。区切り文字は各メッセージにあります。両方を非表示にするには {prefix}&r &7› &7 を削除します。
#
# === 書式 ===
# 色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自の書式には MiniMessage も使用できます。
# & または [ の前にバックスラッシュを付けると、その文字をそのまま表示します。
#
# === 変数 ===
# 変数名は変更せず、各メッセージにもともと含まれている変数だけを使用してください。
#   {added}  言語更新で追加されたメッセージ
#   {after}  変更後の値
#   {argument}  予期しないコマンド引数
#   {attempts}  ポータル作成の試行数
#   {axis}  ポータルの軸
#   {before}  変更前の値
#   {blocks}  ポータルの内部セル数
#   {category}  エディターのカテゴリ
#   {cells}  管理対象の全セル数
#   {command}  コマンドのパス
#   {count}  メッセージ数
#   {created}  作成数または作成日時
#   {creator}  作成者
#   {enabled}  ポータル作成の状態
#   {group}  メッセージのカテゴリ名
#   {hot_reload}  ホットリロードの状態
#   {id}  ポータルの短縮 ID
#   {kept}  言語更新で保持されたローカル編集
#   {key}  パラメーターキー
#   {language}  使用中の言語
#   {line}  メッセージの行番号
#   {locale}  ロケール識別子
#   {matches}  一致するポータル数
#   {materials}  記録されたフレーム素材
#   {maximum}  許容される最大値
#   {name}  言語の正式名
#   {new}  適用された新しい値
#   {old}  以前の値
#   {parameter}  パラメーター名
#   {path}  ローカルレポートのパス
#   {permission}  必要な権限
#   {personal}  サーバーのデフォルトと異なる場合の個人ロケール
#   {portal}  ポータルの識別子
#   {portals}  管理対象ポータル数
#   {prefix}  runtime.prefix の書式付きプラグイン名。区切り文字は各メッセージにあります。両方を非表示にするには {prefix}&r &7› &7 を削除します。
#   {reason}  失敗の理由
#   {rejected}  拒否された作成試行数
#   {remaining}  次回の言語確認が可能になるまでの時間
#   {scheduler}  スケジューラーの実装
#   {seconds}  確認の受付時間（秒）
#   {section}  言語エディターのセクション
#   {setting}  設定名
#   {status}  選択マーク
#   {target}  言語選択の対象
#   {type}  パラメーターの型またはポータルの種類
#   {updated}  言語更新で変更されたメッセージ
#   {url}  公開レポートの URL
#   {uuid}  ポータルの完全な UUID
#   {value}  現在値、デフォルト値、または入力値
#   {variables}  選択したメッセージで使える変数
#   {version}  プラグインのバージョン
#   {world}  ワールド名
#   {x}  基準座標
#   {y}  基準座標
#   {z}  基準座標

