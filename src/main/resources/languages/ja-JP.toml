# ShapedPortals の言語: ja-JP
# このファイルは存在しない場合にのみダウンロードされます。languages/ja-JP.toml を直接編集してください。
# ローカルの変更は自動的に上書きされません。未指定の項目は英語で補完されます。
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自書式には MiniMessage も使用できます。
# プレースホルダーはメッセージごとに固有です。各メッセージに元からあるものだけを残し、名前を変更しないでください。
# コマンド: {argument}=予期しない引数; {command}=コマンド経路; {key}=パラメーターキー; {parameter}=パラメーター名; {type}=型; {usage}=使用法。
# 実行状態: {attempts}=作成試行数; {created}=作成数または作成日時; {rejected}=拒否数; {enabled}=作成状態; {hot_reload}=ホットリロード状態; {scheduler}=スケジューラー。
# ポータル: {portal}=識別子; {portals}=管理数; {id}=短縮 ID; {uuid}=完全な UUID; {world}=ワールド; {axis}=軸; {x}/{y}/{z}=アンカー座標; {blocks}=ポータルセル数; {cells}=全管理セル数; {creator}=作成者; {materials}=記録されたフレーム素材。
# 一覧: {matches}=一致するポータル数; {seconds}=確認期限（秒）。
# 設定: {category}=カテゴリ; {setting}=設定名; {status}=選択記号; {value}=現在値、既定値、または入力値; {language}=使用中の言語; {locale}=ロケール; {name}=言語の正式名。
# 言語エディター: {variables}=使用可能なプレースホルダー; {old}=変更前の値; {new}=変更後の値。
# その他: {duration}=経過ミリ秒; {path}=ローカル報告書のパス; {url}=公開 URL; {reason}=失敗理由.
# 接頭辞: {prefix}=グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります。
# & または [ の前にバックスラッシュを付けると、その文字をそのまま表示できます。

