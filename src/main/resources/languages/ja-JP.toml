# ShapedPortals — ja-JP
#
# === ファイルの編集 ===
# plugins/ShapedPortals/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /shapedportals language server edit ja-JP
#
# === 接頭辞 ===
# {prefix}  グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります
#
# === 書式 ===
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自書式には MiniMessage も使用できます。
# & または [ の前にバックスラッシュを付けると、その文字をそのまま表示できます。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {after}  変更後の値
#   {argument}  予期しない引数
#   {attempts}  作成試行数
#   {axis}  軸
#   {before}  変更前の値
#   {blocks}  ポータルセル数
#   {category}  カテゴリ
#   {cells}  全管理セル数
#   {command}  コマンド経路
#   {count}  マッチングエントリー件数
#   {created}  作成数または作成日時
#   {creator}  作成者
#   {enabled}  作成状態
#   {group}  許可またはプレイヤーグループ
#   {hot_reload}  ホットリロード状態
#   {id}  短縮 ID
#   {key}  パラメーターキー
#   {language}  使用中の言語
#   {line}  ラインまたはライン番号
#   {locale}  ロケール
#   {matches}  一致するポータル数
#   {materials}  記録されたフレーム素材
#   {maximum}  最大許容値
#   {name}  言語の正式名
#   {new}  変更後の値
#   {old}  変更前の値
#   {parameter}  パラメーター名
#   {path}  ローカル報告書のパス
#   {permission}  必要な権限
#   {personal}  個人設定のロケール
#   {plugin}  プラグイン名
#   {portal}  識別子
#   {portals}  管理数
#   {prefix}  グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります
#   {reason}  失敗理由
#   {rejected}  拒否数
#   {scheduler}  スケジューラー
#   {seconds}  確認期限（秒）
#   {setting}  設定名
#   {status}  選択記号
#   {target}  ターゲットプレーヤー、エンティティティティ、または値
#   {type}  型
#   {url}  公開 URL
#   {usage}  使用法
#   {uuid}  完全な UUID
#   {value}  現在値、既定値、または入力値
#   {variables}  使用可能なプレースホルダー
#   {version}  プラグインのバージョン
#   {world}  ワールド
#   {x}  アンカー座標
#   {y}  アンカー座標
#   {z}  アンカー座標

