# ShapedPortals 언어: ko_KR
#
# 이 파일은 없을 때만 다운로드됩니다. languages/ko_KR.toml을 직접 편집하세요.
# 로컬 변경 사항은 자동으로 덮어쓰지 않으며 누락된 항목은 영어를 사용합니다.
#
# 색상: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB]. 사용자 지정 서식에는 MiniMessage도 사용할 수 있습니다.
# 자리표시자는 메시지별로 다릅니다. 각 메시지에 이미 있는 자리표시자만 그대로 두고 이름을 바꾸지 마세요.
#
# 명령어
#   {argument}      예상하지 못한 인수
#   {command}       명령 경로
#   {key}           매개변수 키
#   {parameter}     매개변수 이름
#   {type}          형식
#   {usage}         사용법
#
# 실행 상태
#   {attempts}      생성 시도 수
#   {created}       생성 수 또는 생성 시각
#   {rejected}      거부 수
#   {enabled}       생성 상태
#   {hot_reload}    핫 리로드 상태
#   {scheduler}     스케줄러
#
# 포털
#   {portal}        식별자
#   {portals}       관리 수
#   {id}            짧은 ID
#   {uuid}          전체 UUID
#   {world}         월드
#   {axis}          축
#   {x}/{y}/{z}     기준 좌표
#   {blocks}        포털 셀 수
#   {cells}         전체 관리 셀
#   {creator}       생성자
#   {materials}     기록된 프레임 재료
#
# 목록
#   {matches}       일치하는 포털 수
#   {seconds}       확인 제한 시간(초)
#
# 설정
#   {category}      편집기 범주
#   {setting}       설정 이름
#   {status}        선택 표시
#   {value}         현재값, 기본값 또는 원시값
#   {language}      활성 언어
#   {locale}        로케일
#   {personal}      개인 로케일
#   {name}          언어 전체 이름
#
# 언어 편집기
#   {variables}     사용 가능한 자리표시자
#   {old}           이전 값
#   {new}           새 값
#
# 기타
#   {path}          로컬 보고서 경로
#   {url}           공개 URL
#   {reason}        실패 이유
#
# 접두사
#   {prefix}        전역 runtime.prefix 값입니다. 개별 메시지에서 {prefix}를 제거하면 그 메시지에서만 숨겨집니다
#
# & 또는 [ 앞에 백슬래시를 붙이면 문자를 그대로 표시합니다.

