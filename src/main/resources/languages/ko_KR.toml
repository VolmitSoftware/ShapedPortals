# ShapedPortals — ko_KR
#
# === 파일 편집 ===
# plugins/ShapedPortals/languages/ko_KR.toml
# 이 파일은 직접 편집할 수 있습니다. 로컬 변경 사항은 유지되며, 누락되었거나 잘못된 항목에는 내장된 영어가 사용됩니다.
# /shapedportals language server edit ko_KR
#
# === 접두사 ===
# {prefix}  runtime.prefix에 설정된 서식 있는 플러그인 이름입니다. 구분자는 메시지에 있습니다. 둘 다 숨기려면 {prefix}&r &7› &7을 제거하세요.
#
# === 서식 ===
# 색상: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB]. 사용자 지정 서식에는 MiniMessage도 사용할 수 있습니다.
# & 또는 [ 앞에 백슬래시를 붙이면 해당 문자를 그대로 표시합니다.
#
# === 변수 ===
# 변수 이름은 바꾸지 말고, 각 메시지에 원래 있는 변수만 사용하세요.
#   {added}  언어 업데이트로 추가된 메시지
#   {after}  변경 후 값
#   {argument}  예상하지 못한 명령어 인수
#   {attempts}  차원문 생성 시도 수
#   {axis}  차원문 축
#   {before}  변경 전 값
#   {blocks}  차원문 내부 칸 수
#   {category}  편집기 카테고리
#   {cells}  전체 관리 대상 칸 수
#   {command}  명령어 경로
#   {count}  메시지 수
#   {created}  생성 수 또는 생성 시각
#   {creator}  생성자
#   {enabled}  차원문 생성 상태
#   {group}  메시지 카테고리 이름
#   {hot_reload}  핫 리로드 상태
#   {id}  짧은 차원문 ID
#   {kept}  언어 업데이트에서 유지된 로컬 편집
#   {key}  매개변수 키
#   {language}  사용 중인 언어
#   {line}  메시지 줄 번호
#   {locale}  로케일 식별자
#   {matches}  일치하는 차원문 수
#   {materials}  기록된 틀 재료
#   {maximum}  허용되는 최대값
#   {name}  언어 전체 이름
#   {new}  적용된 새 값
#   {old}  이전 값
#   {parameter}  매개변수 이름
#   {path}  로컬 보고서 경로
#   {permission}  필요한 권한
#   {personal}  서버 기본값과 다를 때의 개인 로케일
#   {portal}  차원문 식별자
#   {portals}  관리 대상 차원문 수
#   {prefix}  runtime.prefix에 설정된 서식 있는 플러그인 이름입니다. 구분자는 메시지에 있습니다. 둘 다 숨기려면 {prefix}&r &7› &7을 제거하세요.
#   {reason}  실패 이유
#   {rejected}  거부된 생성 시도 수
#   {remaining}  다음 언어 확인이 가능해질 때까지 남은 시간
#   {scheduler}  스케줄러 구현
#   {seconds}  확인 제한 시간(초)
#   {section}  언어 편집기 섹션
#   {setting}  설정 이름
#   {status}  선택 표시
#   {target}  언어 선택 대상
#   {type}  매개변수 형식 또는 차원문 유형
#   {updated}  언어 업데이트로 변경된 메시지
#   {url}  공개 보고서 URL
#   {uuid}  차원문 전체 UUID
#   {value}  현재 값, 기본값 또는 원시 값
#   {variables}  선택한 메시지에서 사용할 수 있는 자리표시자
#   {version}  플러그인 버전
#   {world}  세계 이름
#   {x}  기준 좌표
#   {y}  기준 좌표
#   {z}  기준 좌표

