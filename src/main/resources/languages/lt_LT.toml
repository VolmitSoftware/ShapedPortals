# ShapedPortals — lt_LT
#
# === Failo redagavimas ===
# plugins/ShapedPortals/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems ar netinkamiems įrašams naudojamas integruotas angliškas tekstas.
# /shapedportals language server edit lt_LT
#
# === Priešdėlis ===
# {prefix}  Suformatuotas papildinio pavadinimas iš runtime.prefix; skirtukas yra pačiame pranešime. Pašalinkite {prefix}&r &7› &7, kad paslėptumėte ir pavadinimą, ir skirtuką.
#
# === Formatavimas ===
# Spalvos: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ir [RRGGBB]. Savitam formatavimui taip pat galima naudoti MiniMessage.
# Kad & arba [ būtų rodomi kaip paprasti simboliai, prieš juos parašykite kairinį pasvirąjį brūkšnį.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik tuos kintamuosius, kurie yra originaliame pranešime.
#   {added}  kalbos atnaujinimo pridėtų pranešimų skaičius
#   {after}  reikšmė po pakeitimo
#   {argument}  netikėtas argumentas
#   {attempts}  kūrimo bandymų skaičius
#   {axis}  portalo ašis
#   {before}  reikšmė prieš pakeitimą
#   {blocks}  portalo vidinių blokų skaičius
#   {category}  kategorija
#   {cells}  bendras vidinių langelių skaičius
#   {command}  komandos kelias
#   {count}  atitinkančių įrašų skaičius
#   {created}  sukurtų portalų skaičius arba sukūrimo laikas
#   {creator}  kūrėjas
#   {enabled}  portalų kūrimo būsena
#   {group}  leidimas arba žaidėjų grupė
#   {hot_reload}  automatinio įkėlimo būsena
#   {id}  trumpas ID
#   {kept}  kalbos atnaujinimo išsaugoti vietiniai pakeitimai
#   {key}  parametro arba pranešimo raktas
#   {language}  aktyvi kalba
#   {line}  pradinė eilutė arba eilutės numeris
#   {locale}  kalbos kodas
#   {matches}  atitinkančių portalų skaičius
#   {materials}  įrašytos rėmo medžiagos
#   {maximum}  didžiausia leidžiama reikšmė
#   {name}  visas kalbos pavadinimas
#   {new}  nauja reikšmė
#   {old}  ankstesnė reikšmė
#   {parameter}  parametro pavadinimas
#   {path}  vietinės ataskaitos kelias
#   {permission}  reikalingas leidimas
#   {personal}  asmeninės kalbos kodas
#   {portal}  portalo identifikatorius
#   {portals}  valdomų portalų skaičius
#   {prefix}  Suformatuotas papildinio pavadinimas iš runtime.prefix; skirtukas yra pačiame pranešime. Pašalinkite {prefix}&r &7› &7, kad paslėptumėte ir pavadinimą, ir skirtuką.
#   {reason}  klaidos priežastis
#   {rejected}  atmestų bandymų skaičius
#   {remaining}  laikas iki kito leidžiamo kalbų tikrinimo
#   {scheduler}  užduočių planuoklis
#   {seconds}  patvirtinimo laikas sekundėmis
#   {section}  redaktoriaus skiltis
#   {setting}  nustatymo pavadinimas
#   {status}  pasirinkimo žyma
#   {target}  tikslinis žaidėjas, esybė arba reikšmė
#   {type}  tipas
#   {updated}  kalbos atnaujinimo pakeistų pranešimų skaičius
#   {url}  viešas URL
#   {uuid}  visas UUID
#   {value}  dabartinė, numatytoji arba neapdorota reikšmė
#   {variables}  galimi vietos žymekliai
#   {version}  papildinio versija
#   {world}  pasaulis
#   {x}  atskaitos taško X koordinatė
#   {y}  atskaitos taško Y koordinatė
#   {z}  atskaitos taško Z koordinatė

