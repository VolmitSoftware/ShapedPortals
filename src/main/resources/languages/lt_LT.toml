# ShapedPortals kalba: lt_LT
#
# Šis failas atsisiunčiamas tik tada, kai jo nėra; redaguokite languages/lt_LT.toml tiesiogiai.
# Vietiniai pakeitimai niekada automatiškai nekeičiami; trūkstamos reikšmės naudoja anglų kalbą.
#
# Spalvos: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ir [RRGGBB]. Pasirinktiniam formatavimui galima naudoti MiniMessage.
# Vietos žymekliai priklauso konkretiems pranešimams. Palikite tik jau esančius žymeklius ir jų nepervadinkite.
#
# Komandos
#   {argument}      netikėtas argumentas
#   {command}       komandos kelias
#   {key}           parametro raktas
#   {parameter}     parametro vardas
#   {type}          tipas
#   {usage}         komandos naudojimas
#
# Vykdymas
#   {attempts}      kūrimo bandymai
#   {created}       sukurtų skaičius arba laikas
#   {rejected}      atmesti bandymai
#   {enabled}       kūrimo būsena
#   {hot_reload}    karštojo įkėlimo būsena
#   {scheduler}     planavimo sistema
#
# Portalai
#   {portal}        identifikatorius
#   {portals}       valdomų skaičius
#   {id}            trumpas ID
#   {uuid}          visas UUID
#   {world}         pasaulis
#   {axis}          ašis
#   {x}/{y}/{z}     inkaro koordinatės
#   {blocks}        portalo langeliai
#   {cells}         visi langeliai
#   {creator}       kūrėjas
#   {materials}     įrašytos rėmo medžiagos
#
# Sąrašai
#   {matches}       atitinkantys portalai
#   {seconds}       patvirtinimo laikas sekundėmis
#
# Konfigūracija
#   {category}      kategorija
#   {setting}       nuostatos vardas
#   {status}        pasirinkimo žyma
#   {value}         dabartinė, numatytoji arba neapdorota reikšmė
#   {language}      aktyvi kalba
#   {locale}        lokalė
#   {personal}      asmeninė lokalė
#   {name}          visas kalbos pavadinimas
#
# Kalbos redaktorius
#   {variables}     galimi vietos žymekliai
#   {old}           ankstesnė reikšmė
#   {new}           nauja reikšmė
#
# Kita
#   {path}          vietinio pranešimo kelias
#   {url}           viešas URL
#   {reason}        klaidos priežastis
#
# Priešdėlis
#   {prefix}        visuotinė runtime.prefix reikšmė. Pašalinkite {prefix} iš atskiro pranešimo, kad jame jo nerodytų
#
# Norėdami & arba [ rodyti tiesiogiai, prieš juos rašykite pasvirąjį brūkšnį atgal.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cŠią komandą gali naudoti tik žaidėjas.&r"

[runtime.permission]
