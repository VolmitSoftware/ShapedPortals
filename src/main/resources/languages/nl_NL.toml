# ShapedPortals-taal: nl_NL
#
# Dit bestand wordt alleen gedownload als het ontbreekt; bewerk languages/nl_NL.toml rechtstreeks.
# Lokale wijzigingen worden nooit automatisch vervangen; ontbrekende waarden gebruiken Engels.
#
# Kleuren: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB]. MiniMessage blijft beschikbaar voor eigen opmaak.
# Tijdelijke aanduidingen horen bij specifieke berichten. Behoud alleen de al aanwezige aanduidingen en hernoem ze nooit.
#
# Opdrachten
#   {argument}      onverwacht argument
#   {command}       opdrachtpad
#   {key}           parametersleutel
#   {parameter}     parameternaam
#   {type}          type
#   {usage}         opdrachtgebruik
#
# Uitvoering
#   {attempts}      aanmaakpogingen
#   {created}       aantal aangemaakt of aanmaaktijd
#   {rejected}      afgewezen pogingen
#   {enabled}       aanmaakstatus
#   {hot_reload}    hot-reloadstatus
#   {scheduler}     planner
#
# Portalen
#   {portal}        aanduiding
#   {portals}       beheerd aantal
#   {id}            korte ID
#   {uuid}          volledige UUID
#   {world}         wereld
#   {axis}          as
#   {x}/{y}/{z}     ankercoördinaten
#   {blocks}        portaalcellen
#   {cells}         alle beheerde cellen
#   {creator}       maker
#   {materials}     opgenomen framematerialen
#
# Lijsten
#   {matches}       overeenkomende portalen
#   {seconds}       bevestigingstijd in seconden
#
# Configuratie
#   {category}      categorie
#   {setting}       instellingsnaam
#   {status}        selectiemarkering
#   {value}         huidige, standaard- of ruwe waarde
#   {language}      actieve taal
#   {locale}        landinstelling
#   {personal}      persoonlijke landinstelling
#   {name}          volledige taalnaam
#
# Taaleditor
#   {variables}     geldige tijdelijke aanduidingen
#   {old}           vorige waarde
#   {new}           nieuwe waarde
#
# Overig
#   {path}          lokaal rapportpad
#   {url}           openbare URL
#   {reason}        foutreden
#
# Voorvoegsel
#   {prefix}        de globale waarde runtime.prefix. Verwijder {prefix} uit één bericht om het alleen daar te verbergen
#
# Zet een backslash voor & of [ om het teken letterlijk weer te geven.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cDeze opdracht kan alleen door een speler worden gebruikt.&r"

[runtime.permission]
denied = "{prefix}&cJe hebt geen toestemming om dat te doen.&r"

[runtime.hot_reload]
success = "{prefix}&aDe wijzigingen aan de configuratie en taalbestanden zijn toegepast.&r"
failed = "{prefix}&cDe bestandswijzigingen zijn geweigerd; de laatst geldige instellingen blijven actief.&r"

[command.feedback.config]
opened = "{prefix}&aDe volledige configuratie-editor in het spel is geopend.&r"
saved = "{prefix}&a{setting}&r &7is gewijzigd van &f{old}&r &7naar &f{new}&r&7.&r"
save_failed = "{prefix}&c&f{setting}&r&c kon niet worden toegepast: {reason}&r"

[command.feedback]
failed = "{prefix}&cDe opdracht kon niet worden uitgevoerd. Bekijk de console voor meer informatie.&r"

[command.feedback.debug]
started = "{prefix}&7Diagnostische gegevens van de server en ShapedPortals worden verzameld…&r"
busy = "{prefix}&eEr wordt al een diagnostisch rapport voor ShapedPortals gemaakt.&r"
saved = "{prefix}&aHet diagnostische rapport is opgeslagen in &f{path}&r&a.&r"
uploaded = "{prefix}&aDiagnostisch rapport geüpload:&r &b&n{url}&r"
link_hover = "&7Open het openbare rapport op mclo.gs.&r"
upload_failed = "{prefix}&eHet lokale rapport is opgeslagen, maar uploaden naar mclo.gs is mislukt. Bekijk de console voor meer informatie.&r"
failed = "{prefix}&cHet diagnostische rapport kon niet worden gemaakt. Bekijk de console voor meer informatie.&r"

[command.status]
header = "{prefix}&d&lShapedPortals-status&r"
config = "{prefix}&7Aanmaken:&r {enabled} &8|&r &7Taal:&r &f{language}&r &8|&r &7Automatisch herladen:&r {hot_reload}"
portals = "{prefix}&7Beheerde portalen:&r &f{portals}&r &8|&r &7Binnencellen:&r &f{cells}&r"
attempts = "{prefix}&7Pogingen:&r &f{attempts}&r &8|&r &7Aangemaakt:&r &a{created}&r &8|&r &7Geweigerd:&r &c{rejected}&r"
compatibility = "{prefix}&7Artefact:&r &fJava 17 / Bukkit 1.20.1+&r &8|&r &7Planner:&r &f{scheduler}&r"

