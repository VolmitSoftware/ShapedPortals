# ShapedPortals — nl_NL
#
# === Bestand bewerken ===
# plugins/ShapedPortals/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; voor ontbrekende of ongeldige vermeldingen wordt het ingebouwde Engels gebruikt.
# /shapedportals language server edit nl_NL
#
# === Voorvoegsel ===
# {prefix}  Opgemaakte pluginnaam uit runtime.prefix; het scheidingsteken staat in het bericht. Verwijder {prefix}&r &7› &7 om de naam en het scheidingsteken te verbergen.
#
# === Opmaak ===
# Kleuren: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB]. MiniMessage blijft beschikbaar voor eigen opmaak.
# Zet een backslash voor & of [ om het teken letterlijk weer te geven.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {added}  Berichten toegevoegd door een taalupdate
#   {after}  Waarde na de wijziging
#   {argument}  Onverwacht opdrachtargument
#   {attempts}  Pogingen om een portaal aan te maken
#   {axis}  Portaalas
#   {before}  Waarde vóór de wijziging
#   {blocks}  Binnencellen van het portaal
#   {category}  Editorcategorie
#   {cells}  Alle beheerde cellen
#   {command}  Opdrachtpad
#   {count}  Aantal berichten
#   {created}  Aantal aangemaakte portalen of tijdstip van aanmaken
#   {creator}  Maker
#   {enabled}  Status van het aanmaken van portalen
#   {group}  Naam van de berichtcategorie
#   {hot_reload}  Status van automatisch herladen
#   {id}  Korte portaal-ID
#   {kept}  Lokale bewerkingen behouden door een taalupdate
#   {key}  Parametersleutel
#   {language}  Actieve taal
#   {line}  Regelnummer van het bericht
#   {locale}  Taalcode
#   {matches}  Aantal overeenkomende portalen
#   {materials}  Vastgelegde framematerialen
#   {maximum}  Maximaal toegestane waarde
#   {name}  Volledige taalnaam
#   {new}  Nieuwe waarde
#   {old}  Vorige waarde
#   {parameter}  Parameternaam
#   {path}  Lokaal rapportpad
#   {permission}  Vereiste toestemming
#   {personal}  Persoonlijke taalcode als die afwijkt van de serverstandaard
#   {portal}  Portaalaanduiding
#   {portals}  Aantal beheerde portalen
#   {prefix}  Waarde van runtime.prefix; per bericht optioneel
#   {reason}  Foutreden
#   {rejected}  Geweigerde pogingen
#   {remaining}  Resterende tijd tot de volgende taalcontrole
#   {scheduler}  Planner-implementatie
#   {seconds}  Bevestigingstermijn in seconden
#   {section}  Onderdeel van de taaleditor
#   {setting}  Instellingsnaam
#   {status}  Selectiemarkering
#   {target}  Doel van de taalkeuze
#   {type}  Parametertype of portaaltype
#   {updated}  Berichten gewijzigd door een taalupdate
#   {url}  Openbare rapport-URL
#   {uuid}  Volledige portaal-UUID
#   {value}  Huidige, standaard- of ruwe waarde
#   {variables}  Geldige tijdelijke aanduidingen voor het gekozen bericht
#   {version}  Pluginversie
#   {world}  Wereldnaam
#   {x}  Ankercoördinaten
#   {y}  Ankercoördinaten
#   {z}  Ankercoördinaten

