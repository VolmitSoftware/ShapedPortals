# ShapedPortals — pl_PL
#
# === Edycja pliku ===
# plugins/ShapedPortals/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; dla brakujących lub nieprawidłowych wpisów używany jest wbudowany tekst angielski.
# /shapedportals language server edit pl_PL
#
# === Prefiks ===
# {prefix}  Sformatowana nazwa wtyczki z runtime.prefix; separator znajduje się w samej wiadomości. Usuń {prefix}&r &7› &7, aby ukryć nazwę i separator.
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. Do własnego formatowania można też używać MiniMessage.
# Aby wyświetlić & lub [ jako zwykły znak, poprzedź go ukośnikiem odwrotnym.
#
# === Zmienne ===
# Nie zmieniaj nazw zmiennych i używaj tylko tych, które występują w oryginalnym komunikacie.
#   {added}  liczba komunikatów dodanych przez aktualizację języka
#   {after}  wartość po zmianie
#   {argument}  nieoczekiwany argument
#   {attempts}  liczba prób utworzenia
#   {axis}  oś portalu
#   {before}  wartość przed zmianą
#   {blocks}  liczba bloków wewnętrznych portalu
#   {category}  kategoria
#   {cells}  łączna liczba komórek wewnętrznych
#   {command}  ścieżka polecenia
#   {count}  liczba pasujących wpisów
#   {created}  liczba utworzonych portali lub czas utworzenia
#   {creator}  twórca
#   {enabled}  stan tworzenia portali
#   {group}  uprawnienie lub grupa graczy
#   {hot_reload}  stan automatycznego wczytywania
#   {id}  krótki identyfikator
#   {kept}  lokalne edycje zachowane przez aktualizację języka
#   {key}  klucz parametru lub komunikatu
#   {language}  aktywny język
#   {line}  wiersz źródłowy lub numer wiersza
#   {locale}  kod języka
#   {matches}  liczba pasujących portali
#   {materials}  zapisane materiały ramy
#   {maximum}  maksymalna dozwolona wartość
#   {name}  pełna nazwa języka
#   {new}  nowa wartość
#   {old}  poprzednia wartość
#   {parameter}  nazwa parametru
#   {path}  ścieżka lokalnego raportu
#   {permission}  wymagane uprawnienie
#   {personal}  osobisty kod języka
#   {portal}  identyfikator portalu
#   {portals}  liczba zarządzanych portali
#   {prefix}  Sformatowana nazwa wtyczki z runtime.prefix; separator znajduje się w samej wiadomości. Usuń {prefix}&r &7› &7, aby ukryć nazwę i separator.
#   {reason}  powód błędu
#   {rejected}  liczba odrzuconych prób
#   {remaining}  czas pozostały do kolejnego dozwolonego sprawdzenia języków
#   {scheduler}  planista zadań
#   {seconds}  czas na potwierdzenie w sekundach
#   {section}  sekcja edytora
#   {setting}  nazwa ustawienia
#   {status}  znacznik wyboru
#   {target}  docelowy gracz, byt lub wartość
#   {type}  typ
#   {updated}  liczba komunikatów zmienionych przez aktualizację języka
#   {url}  publiczny adres URL
#   {uuid}  pełny UUID
#   {value}  wartość bieżąca, domyślna lub surowa
#   {variables}  dozwolone symbole zastępcze
#   {version}  wersja wtyczki
#   {world}  świat
#   {x}  współrzędna X punktu zaczepienia
#   {y}  współrzędna Y punktu zaczepienia
#   {z}  współrzędna Z punktu zaczepienia

