# ShapedPortals — pl_PL
#
# === Edycja pliku ===
# plugins/ShapedPortals/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /shapedportals language server edit pl_PL
#
# === Prefiks ===
# {prefix}  Sformatowana nazwa wtyczki z runtime.prefix; separator znajduje się w wiadomości. Usuń {prefix}&r &7› &7, aby ukryć oba elementy.
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. MiniMessage pozostaje dostępny dla własnego formatowania.
# Dodaj ukośnik odwrotny przed & lub [, aby wyświetlić znak dosłownie.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {after}  Wartość po zmianie
#   {argument}  nieoczekiwany argument
#   {attempts}  próby utworzenia
#   {axis}  oś
#   {before}  Wartość przed zmianą
#   {blocks}  komórki portalu
#   {category}  kategoria
#   {cells}  wszystkie komórki
#   {command}  ścieżka polecenia
#   {count}  Liczba pasujących wpisów
#   {created}  liczba utworzonych lub czas utworzenia
#   {creator}  twórca
#   {enabled}  stan tworzenia
#   {group}  Zezwolenie lub grupa graczy
#   {hot_reload}  stan przeładowania
#   {id}  krótkie ID
#   {key}  klucz parametru
#   {language}  aktywny język
#   {line}  Numer linii źródłowej lub linii
#   {locale}  ustawienia regionalne
#   {matches}  pasujące portale
#   {materials}  zapisane materiały ramy
#   {maximum}  Maksymalna dopuszczalna wartość
#   {name}  pełna nazwa języka
#   {new}  nowa wartość
#   {old}  poprzednia wartość
#   {parameter}  nazwa parametru
#   {path}  lokalna ścieżka raportu
#   {permission}  wymagane uprawnienie
#   {personal}  osobiste ustawienie regionalne
#   {portal}  identyfikator
#   {portals}  liczba zarządzanych
#   {prefix}  Sformatowana nazwa wtyczki z runtime.prefix; separator znajduje się w wiadomości. Usuń {prefix}&r &7› &7, aby ukryć oba elementy.
#   {reason}  powód błędu
#   {rejected}  odrzucone próby
#   {scheduler}  planista
#   {seconds}  czas na potwierdzenie w sekundach
#   {section}  Sekcja edytora
#   {setting}  nazwa ustawienia
#   {status}  znacznik wyboru
#   {target}  Gracz docelowy, podmiot lub wartość
#   {type}  typ
#   {url}  publiczny URL
#   {uuid}  pełny UUID
#   {value}  wartość bieżąca, domyślna lub surowa
#   {variables}  dozwolone symbole zastępcze
#   {version}  wersja wtyczki
#   {world}  świat
#   {x}  współrzędne kotwicy
#   {y}  współrzędne kotwicy
#   {z}  współrzędne kotwicy

