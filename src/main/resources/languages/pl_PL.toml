# Język ShapedPortals: pl_PL
#
# Ten plik jest pobierany tylko wtedy, gdy go brakuje; edytuj bezpośrednio languages/pl_PL.toml.
# Lokalne zmiany nigdy nie są automatycznie zastępowane; brakujące wpisy używają angielskiego.
#
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. MiniMessage pozostaje dostępny dla własnego formatowania.
# Symbole zastępcze są przypisane do konkretnych wiadomości. Zachowaj tylko już obecne symbole i nigdy nie zmieniaj ich nazw.
#
# Polecenia
#   {argument}      nieoczekiwany argument
#   {command}       ścieżka polecenia
#   {key}           klucz parametru
#   {parameter}     nazwa parametru
#   {type}          typ
#   {usage}         użycie polecenia
#
# Działanie
#   {attempts}      próby utworzenia
#   {created}       liczba utworzonych lub czas utworzenia
#   {rejected}      odrzucone próby
#   {enabled}       stan tworzenia
#   {hot_reload}    stan przeładowania
#   {scheduler}     planista
#
# Portale
#   {portal}        identyfikator
#   {portals}       liczba zarządzanych
#   {id}            krótkie ID
#   {uuid}          pełny UUID
#   {world}         świat
#   {axis}          oś
#   {x}/{y}/{z}     współrzędne kotwicy
#   {blocks}        komórki portalu
#   {cells}         wszystkie komórki
#   {creator}       twórca
#   {materials}     zapisane materiały ramy
#
# Listy
#   {matches}       pasujące portale
#   {seconds}       czas na potwierdzenie w sekundach
#
# Konfiguracja
#   {category}      kategoria
#   {setting}       nazwa ustawienia
#   {status}        znacznik wyboru
#   {value}         wartość bieżąca, domyślna lub surowa
#   {language}      aktywny język
#   {locale}        ustawienia regionalne
#   {personal}      osobiste ustawienie regionalne
#   {name}          pełna nazwa języka
#
# Edytor języka
#   {variables}     dozwolone symbole zastępcze
#   {old}           poprzednia wartość
#   {new}           nowa wartość
#
# Inne
#   {path}          lokalna ścieżka raportu
#   {url}           publiczny URL
#   {reason}        powód błędu
#
# Prefiks
#   {prefix}        globalna wartość runtime.prefix. Usuń {prefix} z pojedynczej wiadomości, aby ukryć go tylko tam
#
# Dodaj ukośnik odwrotny przed & lub [, aby wyświetlić znak dosłownie.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cTej komendy może użyć tylko gracz.&r"

[runtime.permission]
denied = "{prefix}&cNie masz uprawnień, aby to zrobić.&r"

[runtime.hot_reload]
