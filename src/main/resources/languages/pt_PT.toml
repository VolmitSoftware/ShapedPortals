# ShapedPortals — pt_PT
#
# === Editar o ficheiro ===
# plugins/ShapedPortals/languages/pt_PT.toml
# Podes editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /shapedportals language server edit pt_PT
#
# === Prefixo ===
# {prefix}  Nome formatado do plugin em runtime.prefix; o separador está na mensagem. Remove {prefix}&r &7› &7 para ocultar ambos.
#
# === Formatação ===
# Cores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. O MiniMessage continua disponível para formatação personalizada.
# Coloca uma barra invertida antes de & ou [ para apresentar o carácter literalmente.
#
# === Variáveis ===
# Mantém os nomes das variáveis e usa apenas as que pertencem a cada mensagem.
#   {added}  Mensagens adicionadas por uma atualização de idioma
#   {after}  Valor após a alteração
#   {argument}  argumento inesperado
#   {attempts}  tentativas de criação
#   {axis}  eixo
#   {before}  Valor antes da alteração
#   {blocks}  blocos interiores do portal
#   {category}  categoria
#   {cells}  todas as células
#   {command}  caminho do comando
#   {count}  Número de itens correspondentes
#   {created}  quantidade criada ou data de criação
#   {creator}  criador
#   {enabled}  estado de criação
#   {group}  Permissão ou grupo de jogadores
#   {hot_reload}  estado do recarregamento
#   {id}  ID curto
#   {kept}  Edições locais mantidas por uma atualização de idioma
#   {key}  chave do parâmetro
#   {language}  idioma ativo
#   {line}  Linha de origem ou número de linha
#   {locale}  código de idioma
#   {matches}  portais correspondentes
#   {materials}  materiais de moldura registados
#   {maximum}  Valor máximo permitido
#   {name}  nome completo do idioma
#   {new}  valor novo
#   {old}  valor anterior
#   {parameter}  nome do parâmetro
#   {path}  caminho do relatório local
#   {permission}  permissão necessária
#   {personal}  código de idioma pessoal
#   {portal}  identificador
#   {portals}  número de portais geridos
#   {prefix}  Nome formatado do plugin em runtime.prefix; o separador está na mensagem. Remove {prefix}&r &7› &7 para ocultar ambos.
#   {reason}  motivo da falha
#   {rejected}  tentativas rejeitadas
#   {remaining}  Tempo restante até à próxima verificação de idiomas
#   {scheduler}  agendador
#   {seconds}  prazo de confirmação em segundos
#   {section}  Secção do editor
#   {setting}  nome da definição
#   {status}  marca de seleção
#   {target}  Jogador, entidade ou valor de destino
#   {type}  tipo
#   {updated}  Mensagens alteradas por uma atualização de idioma
#   {url}  URL público
#   {uuid}  UUID completo
#   {value}  valor atual, predefinido ou bruto
#   {variables}  marcadores válidos
#   {version}  versão do plugin
#   {world}  mundo
#   {x}  coordenadas da âncora
#   {y}  coordenadas da âncora
#   {z}  coordenadas da âncora

