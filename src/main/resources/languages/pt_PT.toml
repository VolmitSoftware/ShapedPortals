# Idioma do ShapedPortals: pt_PT
# Este ficheiro é transferido apenas quando falta; edita diretamente languages/pt_PT.toml.
# As alterações locais nunca são substituídas automaticamente; as entradas ausentes usam inglês.
# Cores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. O MiniMessage continua disponível para formatação personalizada.
# Os marcadores pertencem a mensagens específicas. Mantém apenas os marcadores já presentes e nunca alteres os seus nomes.
# Comandos: {argument}=argumento inesperado; {command}=caminho do comando; {key}=chave do parâmetro; {parameter}=nome do parâmetro; {type}=tipo; {usage}=utilização do comando.
# Execução: {attempts}=tentativas de criação; {created}=quantidade criada ou data de criação; {rejected}=tentativas rejeitadas; {enabled}=estado de criação; {hot_reload}=estado do recarregamento; {scheduler}=agendador.
# Portais: {portal}=identificador; {portals}=quantidade gerida; {id}=ID curto; {uuid}=UUID completo; {world}=mundo; {axis}=eixo; {x}/{y}/{z}=coordenadas da âncora; {blocks}=células do portal; {cells}=todas as células; {creator}=criador; {materials}=materiais de moldura registados.
# Listas: {matches}=portais correspondentes; {seconds}=prazo de confirmação em segundos.
# Configuração: {category}=categoria; {setting}=nome da definição; {status}=marca de seleção; {value}=valor atual, predefinido ou bruto; {language}=idioma ativo; {locale}=região; {name}=nome completo do idioma.
# Editor de idioma: {variables}=marcadores válidos; {old}=valor anterior; {new}=valor novo.
# Outros: {duration}=milissegundos; {path}=caminho do relatório local; {url}=URL público; {reason}=motivo da falha.
# Prefixo: {prefix}=o valor global runtime.prefix. Remove {prefix} de uma mensagem para o ocultar apenas aí.
# Coloca uma barra inversa antes de & ou [ para apresentar o carácter literalmente.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cEste comando só pode ser utilizado por um jogador.&r"

[runtime.permission]
denied = "{prefix}&cNão tens permissão para fazer isso.&r"

[runtime.hot_reload]
success = "{prefix}&aAs alterações à configuração e aos ficheiros de idioma foram aplicadas.&r"
failed = "{prefix}&cAs alterações aos ficheiros foram rejeitadas; as últimas definições válidas permanecem ativas.&r"

[command.feedback.reload]
success = "{prefix}&aRecarregado em &f{duration}&r&a ms.&r &7Idioma:&r &f{locale}&r"
failed = "{prefix}&cO recarregamento falhou após {duration} ms.&r &7As últimas definições válidas permanecem ativas; consulta o erro completo na consola.&r"

[command.feedback.config]
opened = "{prefix}&aO editor completo de configuração no jogo foi aberto.&r"
saved = "{prefix}&aA definição &f{setting}&r&a foi guardada e aplicada.&r"
save_failed = "{prefix}&cNão foi possível aplicar &f{setting}&r&c: {reason}&r"

[command.feedback]
failed = "{prefix}&cNão foi possível concluir o comando. Consulta a consola para obter detalhes.&r"

[command.feedback.debug]
started = "{prefix}&7A recolher diagnósticos do servidor e do ShapedPortals…&r"
busy = "{prefix}&eJá está a ser criado um relatório de diagnóstico do ShapedPortals.&r"
saved = "{prefix}&aO relatório de diagnóstico foi guardado em &f{path}&r&a.&r"
uploaded = "{prefix}&aRelatório de diagnóstico carregado:&r &b&n{url}&r"
link_hover = "&7Abrir o relatório público no mclo.gs.&r"
upload_failed = "{prefix}&eO relatório local foi guardado, mas o envio para o mclo.gs falhou. Consulta a consola para obter detalhes.&r"
failed = "{prefix}&cNão foi possível criar o relatório de diagnóstico. Consulta a consola para obter detalhes.&r"

[command.status]
header = "{prefix}&d&lEstado do ShapedPortals&r"
config = "{prefix}&7Criação:&r {enabled} &8|&r &7Idioma:&r &f{language}&r &8|&r &7Recarregamento automático:&r {hot_reload}"
portals = "{prefix}&7Portais geridos:&r &f{portals}&r &8|&r &7Células interiores:&r &f{cells}&r"
attempts = "{prefix}&7Tentativas:&r &f{attempts}&r &8|&r &7Criados:&r &a{created}&r &8|&r &7Rejeitados:&r &c{rejected}&r"
compatibility = "{prefix}&7Artefacto:&r &fJava 17 / Bukkit 1.20.1+&r &8|&r &7Agendador:&r &f{scheduler}&r"

