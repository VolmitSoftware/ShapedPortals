[language.editor.part]
line = "Linha {line}"

[language.editor.value]
none = "Nenhum"
empty = "(vazio)"

[debug]
preparing = "{prefix}&r &7› &7&7A preparar o relatório de diagnóstico do {prefix}..."
saved = "{prefix}&r &7› &7&7Relatório de diagnóstico do {prefix} guardado em {path}."

[debug.error]
missing-permission = "{prefix}&r &7› &7&cPermissão em falta: {permission}"
already-preparing = "{prefix}&r &7› &7&cJá está a ser preparado um relatório de diagnóstico do {prefix}."
already-preparing-short = "{prefix}&r &7› &7&cJá está a ser preparado um relatório de diagnóstico."
schedule-failed = "{prefix}&r &7› &7&cNão foi possível agendar a criação do relatório de diagnóstico."
provider-closed = "{prefix}&r &7› &7&cO fornecedor de diagnósticos está encerrado."
closed-before-capture = "{prefix}&r &7› &7&cO fornecedor de diagnósticos foi encerrado antes da recolha dos dados do relatório."
