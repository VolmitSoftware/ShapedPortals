completed = "{prefix}&r &7› &7&7Enviado como VolmitSoftware - {prefix} - v{version}."

[debug.action]
open = "Abrir: {url}"
open-description = "Abrir o relatório de diagnóstico enviado."
copy-path = "Copiar caminho local"
copy-path-description = "Copiar o caminho do relatório local."
