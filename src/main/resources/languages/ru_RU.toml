# ShapedPortals — ru_RU
#
# === Редактирование файла ===
# plugins/ShapedPortals/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /shapedportals language server edit ru_RU
#
# === Префикс ===
# {prefix}  Оформленное имя плагина из runtime.prefix; разделитель находится в самом сообщении. Удалите {prefix}&r &7› &7, чтобы скрыть и имя, и разделитель.
#
# === Форматирование ===
# Цвета: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для собственного оформления также доступен MiniMessage.
# Чтобы показать & или [ как обычный символ, поставьте перед ним обратную косую черту.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только те переменные, которые есть в исходном сообщении.
#   {added}  число сообщений, добавленных обновлением языка
#   {after}  значение после изменения
#   {argument}  неожиданный аргумент
#   {attempts}  число попыток создания
#   {axis}  ось портала
#   {before}  значение до изменения
#   {blocks}  число внутренних блоков портала
#   {category}  категория
#   {cells}  общее число внутренних ячеек
#   {command}  путь команды
#   {count}  число подходящих записей
#   {created}  число созданных порталов или время создания
#   {creator}  создатель
#   {enabled}  состояние создания порталов
#   {group}  разрешение или группа игроков
#   {hot_reload}  состояние горячей перезагрузки
#   {id}  короткий ID
#   {kept}  локальные правки, сохранённые при обновлении языка
#   {key}  ключ параметра или сообщения
#   {language}  активный язык
#   {line}  исходная строка или номер строки
#   {locale}  код языка
#   {matches}  число подходящих порталов
#   {materials}  материалы рамки из записи портала
#   {maximum}  максимально допустимое значение
#   {name}  полное название языка
#   {new}  новое значение
#   {old}  предыдущее значение
#   {parameter}  имя параметра
#   {path}  путь к локальному отчёту
#   {permission}  необходимое разрешение
#   {personal}  личный код языка
#   {portal}  идентификатор портала
#   {portals}  число управляемых порталов
#   {prefix}  Оформленное имя плагина из runtime.prefix; разделитель находится в самом сообщении. Удалите {prefix}&r &7› &7, чтобы скрыть и имя, и разделитель.
#   {reason}  причина ошибки
#   {rejected}  число отклонённых попыток
#   {remaining}  время до следующей разрешённой проверки языков
#   {scheduler}  планировщик
#   {seconds}  время на подтверждение в секундах
#   {section}  раздел редактора
#   {setting}  название настройки
#   {status}  метка выбора
#   {target}  целевой игрок, сущность или значение
#   {type}  тип
#   {updated}  число сообщений, изменённых обновлением языка
#   {url}  публичный URL
#   {uuid}  полный UUID
#   {value}  текущее, стандартное или исходное значение
#   {variables}  допустимые заполнители
#   {version}  версия плагина
#   {world}  мир
#   {x}  координата X опорной точки
#   {y}  координата Y опорной точки
#   {z}  координата Z опорной точки

