# Язык ShapedPortals: ru_RU
# Этот файл загружается только при отсутствии; редактируйте languages/ru_RU.toml напрямую.
# Локальные изменения никогда не заменяются автоматически; для отсутствующих значений используется английский.
# Цвета: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для своего оформления также доступен MiniMessage.
# Заполнители относятся к конкретным сообщениям. Оставляйте только уже имеющиеся заполнители и не переименовывайте их.
# Команды: {argument}=неожиданный аргумент; {command}=путь команды; {key}=ключ параметра; {parameter}=имя параметра; {type}=тип; {usage}=использование команды.
# Выполнение: {attempts}=попытки создания; {created}=число созданных или время создания; {rejected}=отклонённые попытки; {enabled}=состояние создания; {hot_reload}=состояние перезагрузки; {scheduler}=планировщик.
# Порталы: {portal}=идентификатор; {portals}=число управляемых; {id}=короткий ID; {uuid}=полный UUID; {world}=мир; {axis}=ось; {x}/{y}/{z}=координаты якоря; {blocks}=ячейки портала; {cells}=все ячейки; {creator}=создатель; {materials}=записанные материалы рамки.
# Списки: {matches}=совпавшие порталы; {seconds}=время подтверждения в секундах.
# Настройки: {category}=категория; {setting}=название настройки; {status}=метка выбора; {value}=текущее, стандартное или исходное значение; {language}=активный язык; {locale}=локаль; {name}=полное название языка.
# Редактор языка: {variables}=допустимые заполнители; {old}=предыдущее значение; {new}=новое значение.
# Прочее: {duration}=миллисекунды; {path}=путь локального отчёта; {url}=публичный URL; {reason}=причина ошибки.
# Префикс: {prefix}=глобальное значение runtime.prefix. Удалите {prefix} из отдельного сообщения, чтобы скрыть его только там.
# Чтобы показать & или [ буквально, поставьте перед символом обратную косую черту.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cЭту команду может использовать только игрок.&r"

[runtime.permission]
denied = "{prefix}&cУ вас нет разрешения на это действие.&r"

[runtime.hot_reload]
success = "{prefix}&aИзменения конфигурации и языковых файлов применены.&r"
failed = "{prefix}&cИзменения файлов отклонены; последние корректные настройки остаются активными.&r"

[command.feedback.reload]
success = "{prefix}&aПерезагрузка выполнена за &f{duration}&r&a мс.&r &7Язык:&r &f{locale}&r"
failed = "{prefix}&cПерезагрузка завершилась ошибкой через {duration} мс.&r &7Последние корректные настройки всё ещё активны; подробности смотрите в консоли.&r"

[command.feedback.config]
