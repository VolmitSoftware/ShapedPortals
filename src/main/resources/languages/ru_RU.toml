saved = "{prefix}&aДиагностический отчёт сохранён в &f{path}&r&a.&r"
uploaded = "{prefix}&aДиагностический отчёт загружен:&r &b&n{url}&r"
link_hover = "&7Открыть общедоступный отчёт mclo.gs.&r"
upload_failed = "{prefix}&eЛокальный отчёт сохранён, но загрузка на mclo.gs не удалась. Подробности смотрите в консоли.&r"
