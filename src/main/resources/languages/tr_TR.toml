# ShapedPortals — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/ShapedPortals/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz değerlerin yerine yerleşik İngilizce metin kullanılır.
# /shapedportals language server edit tr_TR
#
# === Önek ===
# {prefix}  Biçimlendirilmiş eklenti adı runtime.prefix değerinden gelir. Sohbet şablonları gri › ayırıcısını ekler.
# Adı ve ayırıcıyı gizlemek için mesajın başındaki {prefix}&r &7› &7 bölümünü kaldırın.
#
# === Biçimlendirme ===
# Renkler ve stiller: &0-&f, &k-&r. RGB renkleri: &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ve [RRGGBB]. Özel biçimlendirme için MiniMessage da kullanılabilir.
# & veya [ karakterini olduğu gibi göstermek için önüne ters eğik çizgi koyun.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve her mesajda yalnızca o mesaja ait değişkenleri kullanın.
#   {added}  Dil güncellemesiyle eklenen mesajlar
#   {after}  Değişiklik sonrasındaki değer
#   {argument}  Beklenmeyen komut argümanı
#   {attempts}  Geçit oluşturma denemeleri
#   {axis}  Geçit ekseni
#   {before}  Değişiklik öncesindeki değer
#   {blocks}  Geçidin iç hücreleri
#   {category}  Düzenleyici kategorisi
#   {cells}  Yönetilen tüm hücreler
#   {command}  Komut yolu
#   {count}  Mesaj sayısı
#   {created}  Oluşturulan sayısı veya oluşturma zamanı
#   {creator}  Oluşturanın kimliği
#   {enabled}  Geçit oluşturma durumu
#   {group}  Mesaj kategorisinin adı
#   {hot_reload}  Canlı yeniden yükleme durumu
#   {id}  Kısa geçit kimliği
#   {kept}  Dil güncellemesinde korunan yerel düzenlemeler
#   {key}  Parametre anahtarı
#   {language}  Etkin dil
#   {line}  Mesaj satır numarası
#   {locale}  Yerel ayar kimliği
#   {matches}  Eşleşen geçit sayısı
#   {materials}  Kaydedilmiş çerçeve malzemeleri
#   {maximum}  İzin verilen en büyük değer
#   {name}  Dilin tam adı
#   {new}  Yeni değer
#   {old}  Önceki değer
#   {parameter}  Parametre adı
#   {path}  Yerel rapor yolu
#   {permission}  Gerekli izin
#   {personal}  Sunucu varsayılanından farklıysa kişisel yerel ayar
#   {portal}  Geçit tanımlayıcısı
#   {portals}  Yönetilen geçit sayısı
#   {prefix}  Genel runtime.prefix değeri; her mesajda isteğe bağlıdır
#   {reason}  Hata nedeni
#   {rejected}  Reddedilen oluşturma denemeleri
#   {remaining}  Bir sonraki dil denetimine kalan süre
#   {scheduler}  Zamanlayıcı uygulaması
#   {seconds}  Onay süresi
#   {section}  Dil düzenleyicisi bölümü
#   {setting}  Ayar adı
#   {status}  Seçim işareti
#   {target}  Dil seçiminin hedefi
#   {type}  Parametre türü veya geçit türü
#   {updated}  Dil güncellemesiyle değiştirilen mesajlar
#   {url}  Herkese açık rapor URL'si
#   {uuid}  Geçidin tam UUID'si
#   {value}  Geçerli, varsayılan veya ham değer
#   {variables}  Seçili mesajda geçerli yer tutucular
#   {version}  Eklenti sürümü
#   {world}  Dünya adı
#   {x}  Bağlantı noktası koordinatları
#   {y}  Bağlantı noktası koordinatları
#   {z}  Bağlantı noktası koordinatları

