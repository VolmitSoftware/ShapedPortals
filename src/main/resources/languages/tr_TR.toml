# ShapedPortals — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/ShapedPortals/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /shapedportals language server edit tr_TR
#
# === Önek ===
# {prefix}  genel runtime.prefix değeri. Yalnızca belirli bir iletide gizlemek için o iletiden {prefix} öğesini kaldırın
#
# === Biçimlendirme ===
# Renkler: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ve [RRGGBB]. Özel biçimlendirme için MiniMessage da kullanılabilir.
# & veya [ karakterini olduğu gibi göstermek için önüne ters eğik çizgi koyun.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {after}  Değişim sonrası Değer
#   {argument}  beklenmeyen argüman
#   {attempts}  oluşturma denemeleri
#   {axis}  eksen
#   {before}  Değişim öncesinde değer
#   {blocks}  portal hücreleri
#   {category}  kategori
#   {cells}  tüm hücreler
#   {command}  komut yolu
#   {count}  eşleşen giriş sayısı sayısı
#   {created}  oluşturulan sayı veya zaman
#   {creator}  oluşturan
#   {enabled}  oluşturma durumu
#   {group}  İzin veya oyuncu grubu
#   {hot_reload}  yeniden yükleme durumu
#   {id}  kısa ID
#   {key}  parametre anahtarı
#   {language}  etkin dil
#   {line}  Source line or line number
#   {locale}  yerel ayar
#   {matches}  eşleşen portallar
#   {materials}  kaydedilmiş çerçeve malzemeleri
#   {maximum}  Maksimum izin verilen değer
#   {name}  dilin tam adı
#   {new}  yeni değer
#   {old}  önceki değer
#   {parameter}  parametre adı
#   {path}  yerel rapor yolu
#   {permission}  gerekli izin
#   {personal}  kişisel yerel ayar
#   {plugin}  Plugin name
#   {portal}  tanımlayıcı
#   {portals}  yönetilen sayı
#   {prefix}  genel runtime.prefix değeri. Yalnızca belirli bir iletide gizlemek için o iletiden {prefix} öğesini kaldırın
#   {reason}  hata nedeni
#   {rejected}  reddedilen denemeler
#   {scheduler}  zamanlayıcı
#   {seconds}  saniye cinsinden onay süresi
#   {setting}  ayar adı
#   {status}  seçim işareti
#   {target}  Hedef oyuncu, varlık veya değer
#   {type}  tür
#   {url}  genel URL
#   {usage}  komut kullanımı
#   {uuid}  tam UUID
#   {value}  geçerli, varsayılan veya ham değer
#   {variables}  geçerli yer tutucular
#   {version}  eklenti sürümü
#   {world}  dünya
#   {x}  çapa koordinatları
#   {y}  çapa koordinatları
#   {z}  çapa koordinatları

