# Ngôn ngữ ShapedPortals: vi_VI
#
# Tệp này chỉ được tải xuống khi chưa tồn tại; hãy sửa trực tiếp languages/vi_VI.toml.
# Thay đổi cục bộ không bao giờ bị tự động thay thế; mục còn thiếu dùng tiếng Anh.
#
# Màu: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B và [RRGGBB]. MiniMessage vẫn dùng được cho định dạng tùy chỉnh.
# Mỗi chỗ giữ chỗ chỉ thuộc về các thông báo cụ thể. Chỉ giữ các mã đã có trong thông báo và không đổi tên chúng.
#
# Lệnh
#   {argument}      đối số ngoài dự kiến
#   {command}       đường dẫn lệnh
#   {key}           khóa tham số
#   {parameter}     tên tham số
#   {type}          kiểu
#   {usage}         cách dùng lệnh
#
# Hoạt động
#   {attempts}      lần thử tạo
#   {created}       số đã tạo hoặc thời điểm tạo
#   {rejected}      lần bị từ chối
#   {enabled}       trạng thái tạo
#   {hot_reload}    trạng thái tải lại
#   {scheduler}     bộ lập lịch
#
# Cổng
#   {portal}        mã định danh
#   {portals}       số được quản lý
#   {id}            ID ngắn
#   {uuid}          UUID đầy đủ
#   {world}         thế giới
#   {axis}          trục
#   {x}/{y}/{z}     tọa độ neo
#   {blocks}        ô cổng
#   {cells}         tất cả ô
#   {creator}       người tạo
#   {materials}     vật liệu khung đã ghi
#
# Danh sách
#   {matches}       cổng khớp
#   {seconds}       thời hạn xác nhận tính bằng giây
#
# Cấu hình
#   {category}      danh mục
#   {setting}       tên cài đặt
#   {status}        dấu chọn
#   {value}         giá trị hiện tại, mặc định hoặc thô
#   {language}      ngôn ngữ đang dùng
#   {locale}        mã vùng
#   {personal}      mã vùng cá nhân
#   {name}          tên đầy đủ của ngôn ngữ
#
# Trình sửa ngôn ngữ
#   {variables}     chỗ giữ chỗ hợp lệ
#   {old}           giá trị trước
#   {new}           giá trị mới
#
# Khác
#   {path}          đường dẫn báo cáo cục bộ
#   {url}           URL công khai
#   {reason}        lý do lỗi
#
# Tiền tố
#   {prefix}        giá trị runtime.prefix toàn cục. Xóa {prefix} khỏi từng thông báo nếu không muốn hiện ở thông báo đó
#
# Thêm dấu gạch chéo ngược trước & hoặc [ để hiển thị ký tự theo nghĩa đen.

[runtime]
prefix = "&d&lShapedPortals&r &8›&r "
player_only = "{prefix}&cChỉ người chơi mới có thể sử dụng lệnh này.&r"

[runtime.permission]
denied = "{prefix}&cBạn không có quyền thực hiện thao tác này.&r"

[runtime.hot_reload]
success = "{prefix}&aĐã áp dụng các thay đổi trong tệp cấu hình và ngôn ngữ.&r"
failed = "{prefix}&cĐã từ chối thay đổi tệp; các thiết lập hợp lệ gần nhất vẫn đang hoạt động.&r"

[command.feedback.config]
opened = "{prefix}&aĐã mở trình chỉnh sửa cấu hình đầy đủ trong trò chơi.&r"
saved = "{prefix}&a{setting}&r &7đã đổi từ &f{old}&r &7thành &f{new}&r&7.&r"
save_failed = "{prefix}&cKhông thể áp dụng &f{setting}&r&c: {reason}&r"

[command.feedback]
failed = "{prefix}&cKhông thể hoàn tất lệnh. Hãy xem bảng điều khiển để biết chi tiết.&r"

[command.feedback.debug]
