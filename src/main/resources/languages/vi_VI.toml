# ShapedPortals — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/ShapedPortals/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Các thay đổi cục bộ được giữ lại; mục bị thiếu hoặc không hợp lệ sẽ dùng bản tiếng Anh tích hợp sẵn.
# /shapedportals language server edit vi_VI
#
# === Tiền tố ===
# {prefix}  Tên plugin có định dạng từ runtime.prefix; dấu phân cách nằm trong tin nhắn. Xóa {prefix}&r &7› &7 để ẩn cả hai.
#
# === Định dạng ===
# Màu: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B và [RRGGBB]. MiniMessage vẫn dùng được cho định dạng tùy chỉnh.
# Thêm dấu gạch chéo ngược trước & hoặc [ để hiển thị nguyên ký tự đó.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {added}  Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  Giá trị sau khi thay đổi
#   {argument}  Đối số lệnh ngoài dự kiến
#   {attempts}  Số lần thử tạo cổng
#   {axis}  Trục của cổng
#   {before}  Giá trị trước khi thay đổi
#   {blocks}  Số ô bên trong cổng
#   {category}  Danh mục trong trình chỉnh sửa
#   {cells}  Tổng số ô được quản lý
#   {command}  Đường dẫn lệnh
#   {count}  Số thông báo
#   {created}  Số cổng đã tạo hoặc thời điểm tạo
#   {creator}  Người tạo
#   {enabled}  Trạng thái tạo cổng
#   {group}  Tên danh mục thông báo
#   {hot_reload}  Trạng thái tải lại tức thời
#   {id}  ID ngắn của cổng
#   {kept}  Chỉnh sửa cục bộ được giữ lại sau bản cập nhật ngôn ngữ
#   {key}  Khóa tham số
#   {language}  Ngôn ngữ đang dùng
#   {line}  Số dòng của thông báo
#   {locale}  Mã vùng
#   {matches}  Số cổng khớp
#   {materials}  Vật liệu khung đã ghi nhận
#   {maximum}  Giá trị tối đa được chấp nhận
#   {name}  Tên đầy đủ của ngôn ngữ
#   {new}  Giá trị mới đã áp dụng
#   {old}  Giá trị trước đó
#   {parameter}  Tên tham số
#   {path}  Đường dẫn báo cáo cục bộ
#   {permission}  Quyền cần có
#   {personal}  Mã vùng cá nhân khi khác với mặc định của máy chủ
#   {portal}  Mã định danh cổng
#   {portals}  Số cổng được quản lý
#   {prefix}  Tên plugin có định dạng từ runtime.prefix; dấu phân cách nằm trong tin nhắn. Xóa {prefix}&r &7› &7 để ẩn cả hai.
#   {reason}  Lý do thất bại
#   {rejected}  Số lần tạo cổng bị từ chối
#   {remaining}  Thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {scheduler}  Bộ lập lịch đang dùng
#   {seconds}  Thời hạn xác nhận (giây)
#   {section}  Mục của trình chỉnh sửa ngôn ngữ
#   {setting}  Tên cài đặt
#   {status}  Dấu chọn
#   {target}  Đối tượng của lựa chọn ngôn ngữ
#   {type}  Kiểu tham số hoặc loại cổng
#   {updated}  Thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {url}  URL công khai của báo cáo
#   {uuid}  UUID đầy đủ của cổng
#   {value}  Giá trị hiện tại, mặc định hoặc thô
#   {variables}  Biến dùng được trong thông báo đã chọn
#   {version}  Phiên bản plugin
#   {world}  Tên thế giới
#   {x}  Tọa độ neo
#   {y}  Tọa độ neo
#   {z}  Tọa độ neo

