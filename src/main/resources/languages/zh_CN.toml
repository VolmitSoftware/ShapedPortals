# ShapedPortals — zh_CN
#
# === 编辑文件 ===
# plugins/ShapedPortals/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会被保留；缺失或无效的条目将使用内置英语文本。
# /shapedportals language server edit zh_CN
#
# === 前缀 ===
# {prefix}  runtime.prefix 中带格式的插件名称；分隔符写在各条消息中。删除 {prefix}&r &7› &7 可同时隐藏两者。
#
# === 格式 ===
# 颜色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自定义格式仍可使用 MiniMessage。
# 在 & 或 [ 前加反斜杠可原样显示该字符。
#
# === 变量 ===
# 请勿更改变量名，仅使用各条消息中原有的变量。
#   {added}  语言更新中新增的消息数
#   {after}  更改后的值
#   {argument}  意外的参数
#   {attempts}  创建尝试次数
#   {axis}  轴向
#   {before}  更改前的值
#   {blocks}  传送门内部方块数
#   {category}  编辑器类别
#   {cells}  所有受管传送门的内部格数
#   {command}  命令路径
#   {count}  匹配的条目数
#   {created}  创建数量或创建时间
#   {creator}  创建者
#   {enabled}  创建状态
#   {group}  权限组或玩家组
#   {hot_reload}  热重载状态
#   {id}  短 ID
#   {kept}  语言更新中保留的本地修改数
#   {key}  参数键或消息键
#   {language}  当前语言
#   {line}  源行或行号
#   {locale}  语言代码
#   {matches}  匹配的传送门数
#   {materials}  记录的框架材料
#   {maximum}  允许的最大值
#   {name}  语言全称
#   {new}  新值
#   {old}  旧值
#   {parameter}  参数名称
#   {path}  本地报告路径
#   {permission}  所需权限
#   {personal}  个人语言代码
#   {portal}  传送门标识
#   {portals}  受管传送门数量
#   {prefix}  runtime.prefix 中带格式的插件名称；分隔符写在各条消息中。删除 {prefix}&r &7› &7 可同时隐藏两者。
#   {reason}  失败原因
#   {rejected}  被拒绝次数
#   {remaining}  距下次语言检查的剩余时间
#   {scheduler}  调度器
#   {seconds}  确认时限（秒）
#   {section}  编辑器分区
#   {setting}  设置名称
#   {status}  选择标记
#   {target}  目标玩家、实体或值
#   {type}  类型
#   {updated}  语言更新中更改的消息数
#   {url}  公开报告网址
#   {uuid}  完整 UUID
#   {value}  当前值、默认值或原始值
#   {variables}  可用的占位符
#   {version}  插件版本
#   {world}  世界
#   {x}  锚点坐标
#   {y}  锚点坐标
#   {z}  锚点坐标

