# ShapedPortals 语言：zh_CN
# 此文件仅在缺失时下载；请直接编辑 languages/zh_CN.toml。
# 本地更改绝不会被自动替换；缺少的项目使用英文。
# 颜色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自定义格式仍可使用 MiniMessage。
# 占位符仅适用于特定消息。只保留消息中原有的占位符，且绝不能更改名称。
# 命令：{argument}=意外参数；{command}=命令路径；{key}=参数键；{parameter}=参数名称；{type}=类型；{usage}=命令用法。
# 运行状态：{attempts}=创建尝试数；{created}=创建数或创建时间；{rejected}=拒绝数；{enabled}=创建状态；{hot_reload}=热重载状态；{scheduler}=调度器。
# 传送门：{portal}=标识；{portals}=管理数量；{id}=短 ID；{uuid}=完整 UUID；{world}=世界；{axis}=轴；{x}/{y}/{z}=锚点坐标；{blocks}=传送门格数；{cells}=全部管理格数；{creator}=创建者；{materials}=记录的框架材料。
# 列表：{matches}=匹配的传送门数；{seconds}=确认时限（秒）。
# 配置：{category}=编辑器分类；{setting}=设置名称；{status}=选择标记；{value}=当前值、默认值或原始值；{language}=当前语言；{locale}=区域设置; {name}=语言全名。
# 语言编辑器：{variables}=可用占位符；{old}=旧值；{new}=新值。
# 其他：{duration}=毫秒；{path}=本地报告路径；{url}=公开报告网址；{reason}=失败原因.
# 前缀：{prefix}=全局 runtime.prefix 值。从某条消息中删除 {prefix}，即可只在该消息中隐藏前缀。
# 在 & 或 [ 前添加反斜杠可按原样显示该字符。

