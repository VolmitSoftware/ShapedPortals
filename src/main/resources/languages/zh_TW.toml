# ShapedPortals — zh_TW
#
# === 編輯檔案 ===
# plugins/ShapedPortals/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /shapedportals language server edit zh_TW
#
# === 前綴 ===
# {prefix}  runtime.prefix 中帶格式的外掛名稱；分隔符位於訊息中。刪除 {prefix}&r &7› &7 可隱藏兩者。
#
# === 格式 ===
# 顏色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自訂格式仍可使用 MiniMessage。
# 在 & 或 [ 前加上反斜線可按原樣顯示該字元。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {after}  變更后的值
#   {argument}  意外引數
#   {attempts}  建立嘗試數
#   {axis}  軸
#   {before}  變更前的值
#   {blocks}  傳送門格數
#   {category}  編輯器分類
#   {cells}  全部管理格數
#   {command}  指令路徑
#   {count}  匹配項目數量
#   {created}  建立數或建立時間
#   {creator}  建立者
#   {enabled}  建立狀態
#   {group}  權限或玩家群組
#   {hot_reload}  熱重載狀態
#   {id}  短 ID
#   {key}  參數鍵
#   {language}  目前語言
#   {line}  來源行或行號
#   {locale}  地區設定
#   {matches}  符合的傳送門數
#   {materials}  記錄的框架材料
#   {maximum}  最大允許值
#   {name}  語言完整名稱
#   {new}  新值
#   {old}  舊值
#   {parameter}  參數名稱
#   {path}  本機報告路徑
#   {permission}  所需權限
#   {personal}  個人地區設定
#   {portal}  識別碼
#   {portals}  管理數量
#   {prefix}  runtime.prefix 中帶格式的外掛名稱；分隔符位於訊息中。刪除 {prefix}&r &7› &7 可隱藏兩者。
#   {reason}  失敗原因
#   {rejected}  拒絕數
#   {scheduler}  排程器
#   {seconds}  確認時限（秒）
#   {section}  編輯器區段
#   {setting}  設定名稱
#   {status}  選取標記
#   {target}  目標播放器、 實體或值
#   {type}  類型
#   {url}  公開報告網址
#   {uuid}  完整 UUID
#   {value}  目前值、預設值或原始值
#   {variables}  可用佔位符
#   {version}  外掛程式版本
#   {world}  世界
#   {x}  錨點座標
#   {y}  錨點座標
#   {z}  錨點座標

