# ShapedPortals 語言：zh_TW
#
# 此檔案僅在缺少時下載；請直接編輯 languages/zh_TW.toml。
# 本機變更絕不會被自動取代；缺少的項目使用英文。
#
# 顏色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自訂格式仍可使用 MiniMessage。
# 佔位符僅適用於特定訊息。只保留訊息中原有的佔位符，且絕不能更改名稱。
#
# 指令
#   {argument}      意外引數
#   {command}       指令路徑
#   {key}           參數鍵
#   {parameter}     參數名稱
#   {type}          類型
#   {usage}         指令用法
#
# 執行狀態
#   {attempts}      建立嘗試數
#   {created}       建立數或建立時間
#   {rejected}      拒絕數
#   {enabled}       建立狀態
#   {hot_reload}    熱重載狀態
#   {scheduler}     排程器
#
# 傳送門
#   {portal}        識別碼
#   {portals}       管理數量
#   {id}            短 ID
#   {uuid}          完整 UUID
#   {world}         世界
#   {axis}          軸
#   {x}/{y}/{z}     錨點座標
#   {blocks}        傳送門格數
#   {cells}         全部管理格數
#   {creator}       建立者
#   {materials}     記錄的框架材料
#
# 清單
#   {matches}       符合的傳送門數
#   {seconds}       確認時限（秒）
#
# 設定
#   {category}      編輯器分類
#   {setting}       設定名稱
#   {status}        選取標記
#   {value}         目前值、預設值或原始值
#   {language}      目前語言
#   {locale}        地區設定
#   {personal}      個人地區設定
#   {name}          語言完整名稱
#
# 語言編輯器
#   {variables}     可用佔位符
#   {old}           舊值
#   {new}           新值
#
# 其他
#   {path}          本機報告路徑
#   {url}           公開報告網址
#   {reason}        失敗原因
#
# 前綴
#   {prefix}        全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴
#
# 在 & 或 [ 前加上反斜線可按原樣顯示該字元。

