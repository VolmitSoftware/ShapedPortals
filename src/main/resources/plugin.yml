name: ${name}
version: ${version}
main: ${main}
api-version: '${apiVersion}'
folia-supported: true
load: POSTWORLD
authors:
  - VolmitSoftware
  - Arcane Arts
  - SwiftSwamp
  - NextdoorPsycho
website: https://volmitsoftware.com
description: Custom-shaped Nether and horizontal End portals with saved records, integrity repair, and in-game administration.
softdepend: [Wormholes]
commands:
  shapedportals:
    aliases: [shapedportal, sp]
    description: ShapedPortals help and administration
    usage: /shapedportals

permissions:
  shapedportals.update:
    description: Includes ShapedPortals in shared update notices and permits its update report
    default: op
  shapedportals.create:
    description: Allows igniting shaped portals
    default: true
  shapedportals.command:
    description: Allows viewing ShapedPortals help and status
    default: true
  shapedportals.config:
    description: Allows editing ShapedPortals configuration in game
    default: op
  shapedportals.language.self:
    description: Allows choosing a personal ShapedPortals language
    default: true
  shapedportals.debug:
    description: Allows creating and optionally uploading ShapedPortals diagnostic reports
    default: op
  shapedportals.portals:
    description: Allows listing managed portals and their locations
    default: op
  shapedportals.teleport:
    description: Allows teleporting safely beside managed portals
    default: op
  shapedportals.teleport.unsafe:
    description: Allows confirming a teleport into an unsafe position beside a managed portal
    default: op
